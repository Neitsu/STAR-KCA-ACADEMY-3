<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KÆOS PROJECT - Star KCA Academy</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Playfair+Display:ital,wght@0,600;0,800;1,400&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --tarot-bg: #181818;      
      --tarot-gold: #E2B961;    
      --tarot-gold-dim: rgba(226, 185, 97, 0.22);
      --tarot-danger: #D93838;  
      --tarot-danger-dim: rgba(217, 56, 56, 0.45);
      --tarot-ash: #555555;
      --tarot-ash-dark: #121212;

      --bg: #0A0A0A;
      --panel: #121212;
      --panel2: #1A1A1A;
      --text: #F0EDE5;
      --muted: #888888;
      --line: #2E2E2E;
      --accent: #E2B961; 
      --radius: 6px;
    }
    
    * { box-sizing: border-box; }
    
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--tarot-gold); }

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      color: var(--text);
      background-color: var(--bg);
      background-image: radial-gradient(circle at 50% 0%, #1a150e 0%, #0A0A0A 65%);
      background-attachment: fixed;
      overflow-x: hidden;
    }
    
    h1, h2, h3, h4 {
      font-family: 'Cinzel', 'Playfair Display', serif;
      color: var(--tarot-gold);
      font-weight: 700;
      letter-spacing: 2.5px;
    }
    .container { width: min(1320px, 94vw); margin: 0 auto; }

    /* ==========================================
       MENU D'ACCUEIL (4 CARTES DE TAROT 3D)
       ========================================== */
    #landing-menu {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 2rem 0; transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .menu-header { text-align: center; margin-bottom: 2.5rem; color: var(--tarot-gold); padding: 0 1rem; }
    .menu-header h1 { font-size: clamp(2.2rem, 5vw, 3.6rem); letter-spacing: 6px; text-transform: uppercase; margin: 0 0 10px 0; text-shadow: 0 0 25px rgba(226, 185, 97, 0.35); }
    .menu-header p { font-family: 'Poppins', sans-serif; font-size: clamp(0.75rem, 2vw, 1rem); letter-spacing: 6px; text-transform: uppercase; margin: 0; color: #999; }
    
    .cards-layout { display: flex; gap: 28px; justify-content: center; flex-wrap: wrap; max-width: 1400px; padding: 20px; }
    
    .card-container { width: 270px; height: 430px; perspective: 1500px; cursor: pointer; position: relative; }
    .tarot-flip-card { width: 100%; height: 100%; position: relative; transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-style: preserve-3d; }
    
    @media (hover: hover) {
      .card-container:hover .tarot-flip-card { transform: rotateY(180deg) translateY(-16px); }
    }
    .card-container.flipped .tarot-flip-card { transform: rotateY(180deg) translateY(-10px); }
    
    .card-face {
      position: absolute; width: 100%; height: 100%; backface-visibility: hidden; -webkit-backface-visibility: hidden;
      background-color: var(--tarot-bg); border: 2px solid var(--tarot-gold); border-radius: 6px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.85); padding: 10px;
    }
    
    .card-front {
      display: flex; justify-content: center; align-items: center;
      background-image: linear-gradient(rgba(226, 185, 97, 0.14) 1px, transparent 1px), linear-gradient(90deg, rgba(226, 185, 97, 0.14) 1px, transparent 1px);
      background-size: 20px 20px; background-position: center;
    }
    .card-front::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle, rgba(20,20,20,0.55) 0%, rgba(10,10,10,0.94) 100%); }
    .card-front-inner { position: relative; z-index: 2; width: 88%; height: 92%; border: 1px solid var(--tarot-gold); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 18px; }
    .card-front-label { font-family: 'Cinzel', serif; color: var(--tarot-gold); letter-spacing: 3px; font-size: 0.85rem; text-transform: uppercase; opacity: 0.85; }

    .front-symbol {
      width: 84px; height: 84px; border: 2px solid var(--tarot-gold); border-radius: 50%; background-color: var(--tarot-bg);
      display: flex; justify-content: center; align-items: center; font-size: 2.5rem; color: var(--tarot-gold);
      box-shadow: 0 0 25px rgba(226, 185, 97, 0.25), inset 0 0 15px rgba(226, 185, 97, 0.3); text-shadow: 0 0 15px rgba(226, 185, 97, 0.8);
    }
    
    .card-back { transform: rotateY(180deg); }
    .enter-hint {
      position: absolute; bottom: 52px; background: rgba(226, 185, 97, 0.95); color: #0A0A0A;
      font-size: 0.68rem; font-weight: 700; letter-spacing: 2px; padding: 4px 14px; border-radius: 99px;
      text-transform: uppercase; z-index: 5; box-shadow: 0 0 15px rgba(226, 185, 97, 0.5);
    }

    /* ==========================================
       HEADER & BARRE DE CHANGEMENT DE CERCLE
       ========================================== */
    #app-dashboard { display: none; opacity: 0; transition: opacity 0.6s ease; }
    
    header {
      position: sticky; top: 0; z-index: 40; backdrop-filter: blur(14px);
      background: rgba(10, 10, 10, 0.9); border-bottom: 1px solid var(--tarot-gold-dim); box-shadow: 0 4px 25px rgba(0,0,0,0.7);
    }
    .topbar { min-height: 70px; display: flex; align-items: center; justify-content: space-between; gap: 0.8rem; flex-wrap: wrap; padding: 0.7rem 0; }
    
    .brand { cursor: pointer; transition: transform 0.3s ease; }
    .brand:hover { transform: scale(1.02); }
    .brand h1 { margin: 0; font-size: 1.4rem; text-transform: uppercase; letter-spacing: 4px; color: var(--tarot-gold); }
    .brand p { margin: 0.15rem 0 0; color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 2px; }
    
    .circle-switcher {
      display: flex; align-items: center; gap: 0.35rem; background: #0d0d0d; padding: 4px;
      border-radius: 6px; border: 1px solid var(--line);
    }
    .circle-btn {
      background: transparent; color: var(--muted); border: 1px solid transparent; border-radius: 4px;
      padding: 0.32rem 0.65rem; font-size: 0.76rem; font-family: 'Poppins'; cursor: pointer;
      transition: all 0.25s ease; display: flex; align-items: center; gap: 5px; white-space: nowrap;
      text-transform: uppercase; letter-spacing: 1px;
    }
    .circle-btn:hover { color: var(--tarot-gold); }
    .circle-btn.active {
      background: rgba(226, 185, 97, 0.14); color: var(--tarot-gold);
      border-color: var(--tarot-gold); font-weight: 600; box-shadow: 0 0 10px rgba(226, 185, 97, 0.18);
    }

    .nav-wrapper { display: flex; align-items: center; gap: 0.7rem; flex-wrap: wrap; }
    nav { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .nav-link {
      text-decoration: none; color: var(--text); background: var(--panel);
      border: 1px solid var(--line); border-radius: 4px; padding: 0.4rem 0.72rem; font-size: 0.78rem;
      transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 1px;
    }
    .nav-link:hover { border-color: var(--tarot-gold); color: var(--tarot-gold); }
    .nav-link.active { background: var(--tarot-gold); color: var(--bg); border-color: var(--tarot-gold); font-weight: 600; }
    
    .lang-select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 0.35rem 0.55rem; font-size: 0.78rem; cursor: pointer; outline: none; font-family: 'Poppins'; }

    /* Bannière Mode Démo sobre */
    .demo-banner {
      background: #111111;
      border-bottom: 1px solid var(--tarot-gold-dim); padding: 0.5rem 1rem; text-align: center;
      font-size: 0.78rem; display: flex; justify-content: center; align-items: center; gap: 1rem; flex-wrap: wrap;
      color: var(--text);
    }
    .demo-toggle-btn {
      background: transparent; color: var(--tarot-gold); border: 1px solid var(--tarot-gold); border-radius: 4px;
      padding: 0.22rem 0.75rem; font-size: 0.72rem; font-weight: 600; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
      transition: all 0.25s;
    }
    .demo-toggle-btn:hover { background: var(--tarot-gold); color: var(--bg); }

    main { padding: 2rem 0 4rem; }
    
    @keyframes fadeInSlide { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .page { display: none; }
    .page.active { display: block; animation: fadeInSlide 0.45s ease forwards; }

    .card-paper {
      background: var(--panel); border: 1px solid var(--tarot-gold-dim); border-radius: 6px; padding: 2rem; margin-bottom: 2rem;
      box-shadow: 0 15px 40px rgba(0,0,0,0.85), inset 0 0 25px rgba(226,185,97,0.02); position: relative;
    }
    
    h2 { font-size: clamp(1.45rem, 3vw, 1.95rem); text-transform: uppercase; margin-top: 0; }
    h3 { font-size: 1.25rem; text-transform: uppercase; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
    .small { color: var(--muted); font-size: 0.84rem; }
    
    .filters { display: flex; flex-wrap: wrap; gap: 0.8rem; margin-bottom: 1rem; align-items: center; }
    input, select { border-radius: 4px; border: 1px solid var(--line); outline: none; background: var(--bg); color: var(--text); padding: 0.6rem 0.8rem; transition: all 0.3s; font-family: 'Poppins'; }
    input:focus, select:focus { border-color: var(--tarot-gold); box-shadow: 0 0 10px var(--tarot-gold-dim); }
    
    /* ==========================================
       GRILLE & CARTES DES CANDIDATS
       ========================================== */
    .contestants-grid { display: grid; gap: 2rem; grid-template-columns: repeat(auto-fill, minmax(265px, 1fr)); align-items: center; justify-items: center; padding: 1rem 0; }
    
    .tarot-card {
      width: 270px; height: 415px; background-color: var(--tarot-bg); border: 2px solid var(--tarot-gold);
      border-radius: 6px; padding: 10px; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.85);
      cursor: pointer; transition: transform 0.35s ease, box-shadow 0.35s ease; overflow: hidden;
    }
    .tarot-card::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(125deg, transparent 30%, rgba(226, 185, 97, 0.12) 50%, transparent 70%);
      transform: translateX(-100%); transition: transform 0.6s ease; pointer-events: none;
    }
    .tarot-card:hover { transform: translateY(-10px); box-shadow: 0 25px 50px rgba(0,0,0,0.95), 0 0 25px var(--tarot-gold-dim); z-index: 10; }
    .tarot-card:hover::after { transform: translateX(100%); }

    .tarot-inner-border { position: absolute; inset: 10px; border: 1px solid var(--tarot-gold); display: flex; flex-direction: column; align-items: center; }

    .corner { position: absolute; width: 6px; height: 6px; border: 1px solid var(--tarot-gold); border-radius: 50%; background-color: var(--tarot-bg); }
    .corner-tl { top: -4px; left: -4px; } .corner-tr { top: -4px; right: -4px; }
    .corner-bl { bottom: -4px; left: -4px; } .corner-br { bottom: -4px; right: -4px; }

    .tarot-top-icon { position: absolute; top: -11px; color: var(--tarot-gold); font-size: 14px; background: var(--tarot-bg); padding: 0 8px; }

    .tarot-name {
      color: var(--tarot-gold); font-family: 'Cinzel', 'Playfair Display', serif; font-size: 1.55rem; font-weight: 700;
      letter-spacing: 3px; text-transform: uppercase; margin-top: 24px; z-index: 2; text-align: center;
      width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 10px;
    }

    .tarot-image-container { position: absolute; top: 76px; width: 100%; height: 230px; display: flex; justify-content: center; align-items: center; }
    .tarot-image-container img { max-width: 95%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.65)); transition: filter 0.3s ease, transform 0.3s ease; }
    .tarot-card:hover .tarot-image-container img { transform: scale(1.03); }

    .tarot-badge {
      position: absolute; bottom: 50px; z-index: 3; font-size: 0.6rem; font-weight: 700;
      letter-spacing: 1.5px; text-transform: uppercase; padding: 3px 10px; border-radius: 4px;
    }

    .tarot-rank {
      position: absolute; bottom: 16px; color: var(--tarot-gold); font-family: 'Cinzel', 'Playfair Display', serif;
      font-size: 1rem; letter-spacing: 3px; text-transform: uppercase; display: flex; align-items: center; gap: 10px;
    }

    /* Symboles des Cercles */
    .theme-sun .front-symbol::before { content: '✹'; font-size: 2.8rem; }
    .theme-sun .tarot-top-icon::before { content: '✹'; }
    .theme-sun .tarot-rank::before, .theme-sun .tarot-rank::after { content: '✹'; font-size: 0.7rem; }
    
    .theme-moon .front-symbol::before { content: '☾'; font-size: 2.8rem; margin-top: -4px; }
    .theme-moon .tarot-top-icon::before { content: '☾'; font-size: 15px; }
    .theme-moon .tarot-rank::before { content: '☽'; font-size: 0.85rem; }
    .theme-moon .tarot-rank::after { content: '☾'; font-size: 0.85rem; }
    
    .theme-star .front-symbol::before { content: '✦'; font-size: 2.9rem; }
    .theme-star .tarot-top-icon::before { content: '✦'; }
    .theme-star .tarot-rank::before, .theme-star .tarot-rank::after { content: '✦'; font-size: 0.75rem; }
    
    .theme-global .front-symbol::before { content: '☉'; font-size: 2.8rem; }
    .theme-global .tarot-top-icon::before { content: '☉'; font-size: 15px; }
    .theme-global .tarot-rank::before, .theme-global .tarot-rank::after { content: '☉'; font-size: 0.85rem; }

    /* État : SHADOW ZONE (Nominé) — Seul élément en Rouge Carmin */
    @keyframes dangerPulse {
      0%, 100% { box-shadow: 0 20px 40px rgba(0,0,0,0.85), 0 0 18px rgba(217, 56, 56, 0.35); }
      50% { box-shadow: 0 20px 45px rgba(0,0,0,0.9), 0 0 32px rgba(217, 56, 56, 0.65); }
    }
    .danger-zone { border-color: var(--tarot-danger); animation: dangerPulse 3s infinite ease-in-out; }
    .danger-zone:hover { box-shadow: 0 25px 50px rgba(0,0,0,0.95), 0 0 35px var(--tarot-danger); }
    .danger-zone .tarot-inner-border, .danger-zone .corner { border-color: var(--tarot-danger); }
    .danger-zone .tarot-name, .danger-zone .tarot-rank, .danger-zone .tarot-top-icon { color: var(--tarot-danger); }
    .danger-zone .tarot-image-container img {
      filter: drop-shadow(0 0 14px rgba(217, 56, 56, 0.75)) drop-shadow(0 8px 15px rgba(0,0,0,0.8));
    }

    /* État : CONSUMÉ (Éliminé) */
    .eliminated { border-color: var(--tarot-ash); background-color: var(--tarot-ash-dark); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
    .eliminated:hover { transform: translateY(-4px); box-shadow: 0 15px 30px rgba(0,0,0,0.8); }
    .eliminated .tarot-inner-border, .eliminated .corner { border-color: var(--tarot-ash); }
    .eliminated .corner, .eliminated .tarot-top-icon { background-color: var(--tarot-ash-dark); }
    .eliminated .tarot-name, .eliminated .tarot-rank, .eliminated .tarot-top-icon { color: #555; }
    .eliminated .tarot-image-container img { filter: grayscale(100%) contrast(120%) brightness(45%); opacity: 0.75; }

    /* Pills & Statuts (Palette stricte Noir / Or / Cendre / Rouge uniquement pour Shadow Zone) */
    .pill { display: inline-block; padding: 0.26rem 0.72rem; border-radius: 4px; font-size: 0.7rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; border: 1px solid; }
    .safe { background: rgba(226, 185, 97, 0.08); color: var(--tarot-gold); border-color: var(--tarot-gold); }
    .nominee { background: var(--tarot-danger); color: #ffffff; border-color: var(--tarot-danger); }
    .saved_judges, .saved_public { background: #141414; color: var(--tarot-gold); border-color: var(--tarot-gold-dim); }
    .eliminated-pill { background: var(--tarot-ash-dark); color: #777777; border-color: var(--tarot-ash); }
    .tbd { background: var(--panel2); color: var(--muted); border-color: var(--line); }
    .winner { background: var(--tarot-gold); color: var(--bg); border-color: var(--tarot-gold); font-weight: 800; box-shadow: 0 0 15px rgba(226, 185, 97, 0.45); }
    
    /* Layout Profil & Grilles */
    .row { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
    @media (min-width: 880px) {
      .row.two { grid-template-columns: 330px 1fr; gap: 2.5rem; align-items: start; }
      .row.charts-split { grid-template-columns: 1fr 1.3fr; gap: 2rem; align-items: center; }
    }
    
    .profile-img-wrap { width: 100%; max-width: 330px; background: var(--tarot-bg); border: 2px solid var(--tarot-gold); border-radius: 6px; padding: 12px; display: flex; justify-content: center; position: relative; }
    .profile-img-wrap::before { content:''; position: absolute; inset: 6px; border: 1px solid var(--tarot-gold); pointer-events: none; }
    .profile-img { width: 100%; height: auto; object-fit: contain; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.8)); z-index: 2; }
    .profile-content { min-width: 0; width: 100%; }
    
    .btn { text-decoration: none; color: var(--tarot-gold); border: 1px solid var(--tarot-gold); background: transparent; border-radius: 4px; padding: 0.55rem 1.15rem; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; transition: all 0.3s; font-family: 'Poppins'; font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 1.5px; }
    .btn:hover { background: var(--tarot-gold); color: var(--bg); box-shadow: 0 0 15px var(--tarot-gold-dim); }
    .btn-primary { background: var(--tarot-gold); color: var(--bg); }
    .btn-primary:hover { background: #f0ca70; box-shadow: 0 0 22px rgba(226, 185, 97, 0.45); }
    
    .profile-nav { display: flex; gap: 0.7rem; align-items: center; flex-wrap: wrap; margin-bottom: 1.8rem; border-bottom: 1px solid var(--line); padding-bottom: 1rem; }
    
    .table-wrap { overflow-x: auto; margin-bottom: 1rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th { font-family: 'Cinzel', 'Playfair Display', serif; font-size: 0.9rem; color: var(--tarot-gold); border-bottom: 2px solid var(--tarot-gold); padding: 0.9rem 0.5rem; text-align: left; white-space: nowrap; letter-spacing: 1.5px; }
    td { border-bottom: 1px dotted var(--line); padding: 0.85rem 0.5rem; text-align: left; white-space: nowrap; }
    .table-wrap a { color: var(--tarot-gold); text-decoration: none; font-weight: 600; transition: color 0.2s; }
    .table-wrap a:hover { color: #fff; text-shadow: 0 0 8px var(--tarot-gold-dim); }
    
    .chip { display: inline-block; border: 1px solid var(--tarot-gold); border-radius: 4px; padding: 0.2rem 0.6rem; font-size: 0.74rem; background: rgba(226,185,97,0.1); font-weight: 600; }

    /* ==========================================
       PORTAIL D'AUDITIONS (1er - 13 NOVEMBRE)
       ========================================== */
    .audition-hero {
      text-align: center; padding: 3.2rem 1.5rem;
      background: radial-gradient(circle at center, rgba(226,185,97,0.06) 0%, transparent 70%);
    }
    .countdown-grid { display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap; margin: 2rem 0; }
    .countdown-box {
      background: #0d0d0d; border: 1px solid var(--tarot-gold); border-radius: 6px;
      width: 95px; padding: 0.9rem 0.5rem; box-shadow: 0 8px 20px rgba(0,0,0,0.7);
    }
    .countdown-num { font-family: 'Cinzel', 'Playfair Display', serif; font-size: 2rem; color: var(--tarot-gold); font-weight: 800; line-height: 1; }
    .countdown-lbl { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin-top: 6px; }

    /* ==========================================
       LA BALANCE ANIMÉE (PAGE VOTES)
       ========================================== */
    .scale-showcase {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 1.8rem 1rem; margin: 1.5rem 0; background: #0d0d0d;
      border: 1px solid var(--line); border-radius: 6px;
    }
    @keyframes rockBeam {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(4deg); }
    }
    .scale-svg { width: 220px; height: 130px; overflow: visible; }
    .scale-beam-group { transform-origin: 110px 35px; animation: rockBeam 6s ease-in-out infinite; }
    .scale-quotas { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; margin-top: 1.2rem; }
    .quota-card {
      background: #121212; border: 1px solid var(--line); border-radius: 6px;
      padding: 0.75rem 1.2rem; text-align: center; min-width: 155px;
    }
    .quota-card.shadow-quota { border-color: rgba(217, 56, 56, 0.5); }
    .quota-card strong { display: block; font-family: 'Cinzel', serif; font-size: 1.4rem; color: var(--text); }
    .quota-card.shadow-quota strong { color: var(--tarot-danger); }

    .vote-row { margin-bottom: 1.2rem; background: #0e0e0e; padding: 0.95rem 1.15rem; border-radius: 6px; border: 1px solid var(--line); }
    .bar { width: 100%; height: 7px; background: #222; border-radius: 999px; overflow: hidden; margin-top: 0.55rem; }
    .bar > span { display: block; height: 100%; background: var(--tarot-gold); transition: width 0.6s ease; box-shadow: 0 0 10px rgba(226, 185, 97, 0.5); }

    /* ==========================================
       LE GRIMOIRE (STYLE MYSTIQUE & ÉSOTÉRIQUE)
       ========================================== */
    .grimoire-intro {
      text-align: center; max-width: 820px; margin: 0 auto 2.5rem;
      padding: 1.8rem; background: #0d0d0d; border: 1px solid var(--tarot-gold-dim); border-radius: 6px;
    }
    .grimoire-motto {
      font-family: 'Cinzel', serif; color: var(--tarot-gold); letter-spacing: 5px;
      font-size: 0.85rem; text-transform: uppercase; margin-bottom: 0.8rem; display: block;
    }

function parseCSV(text) {
  const rows = []; let row = []; let inQuotes = false; let val = "";
  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    if (inQuotes) {
      if (char === '"') {
        if (text[i + 1] === '"') { val += '"'; i++; } else { inQuotes = false; }
      } else { val += char; }
    } else {
      if (char === '"') { inQuotes = true; }
      else if (char === ',') { row.push(val); val = ""; }
      else if (char === '\n' || char === '\r') {
        row.push(val); rows.push(row); row = []; val = "";
        if (char === '\r' && text[i + 1] === '\n') i++;
      } else { val += char; }
    }
  }
  if (val !== "" || row.length > 0) { row.push(val); rows.push(row); }
  if (rows.length < 1) return [];
  
  let headerIndex = 0;
  for (let i = 0; i < Math.min(5, rows.length); i++) {
    if (rows[i].some(c => typeof c === 'string' && ['contestant', 'name', 'candidat', 'eleve', 'username'].some(k => c.toLowerCase().includes(k)))) {
      headerIndex = i; break;
    }
  }
  
  const headers = rows[headerIndex].map(h => String(h).trim().toLowerCase());
  return rows.slice(headerIndex + 1).map(r => {
    const obj = {};
    headers.forEach((h, i) => { if (h) obj[h] = r[i] !== undefined ? String(r[i]).trim() : ''; });
    return obj;
  });
}

async function fetchSheetTab(sheetName, customSheetId = null) {
  const targetId = customSheetId || CONFIG.SHEET_ID;
  if (!targetId) return [];
  
  const tryFetch = async (name) => {
    const url = `https://docs.google.com/spreadsheets/d/${targetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(name)}&_=${Date.now()}`;
    try {
      const response = await fetch(url);
      if (!response.ok) return null;
      const txt = await response.text();
      if (txt.toLowerCase().includes('<!doctype html>')) return null;
      return parseCSV(txt);
    } catch (e) { return null; }
  };

  let data = await tryFetch(sheetName);
  if (!data && sheetName === 'R5') {
    data = await tryFetch('FINAL') || await tryFetch('Finale') || await tryFetch('Round 5');
  }
  if (!data && sheetName.match(/^R\d$/)) {
    const num = sheetName.replace('R', '');
    data = await tryFetch(`Round ${num}`) || await tryFetch(`ROUND ${num}`);
  }
  return data || [];
}

function keyNorm(k) { return String(k || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
function pickValue(row, aliases) {
  const keys = Object.keys(row);
  for (const a of aliases) {
    const n = keyNorm(a);
    const real = keys.find(k => keyNorm(k) === n);
    if (real != null && row[real] !== null && row[real] !== undefined && String(row[real]).trim() !== '' && String(row[real]).toLowerCase() !== 'nan') return row[real];
  }
  return '';
}
function parseNum(val) {
  if (val === '' || val === null || val === undefined) return NaN;
  const num = Number(String(val).replace(/\s/g, '').replace(',', '.'));
  return isNaN(num) ? NaN : num;
}

function getStatus(roundId, contestantId) { return state.data.round_status.find(r => r.round_id === roundId && r.contestant_id === contestantId)?.status || ''; }
function statusClass(status) {
  if (status === 'eliminated') return 'eliminated-pill';

function getActiveCountForRound(roundId, teamClass) {
  const rIdx = ROUND_ORDER.indexOf(roundId);
  const isGlobalPhase = (roundId === 'PRERANK' || roundId === 'FINAL');
  let count = 0;
  state.data.contestants.forEach(c => {
    if (!isGlobalPhase && teamClass && c.teamClass !== teamClass) return;
    const elimIdx = getFirstEliminatedRoundIndex(c.id);
    if (elimIdx === -1 || elimIdx >= rIdx) count++;
  });
  if (count > 0) return count;
  if (roundId === 'FINAL') return 12;
  return isGlobalPhase ? 48 : 16;
}

function getPerformanceScoreByRound() {
  const out = Object.fromEntries(ROUND_ORDER.map(r => [r, {}]));
  ROUND_ORDER.forEach(round => {
    state.data.contestants.forEach(c => {
      const activeCount = getActiveCountForRound(round, c.teamClass);
      const pointsBase = activeCount + 1;

      let totalPoints = 0; let hasData = false;
      const rawScoreRec = state.data.scores.find(s => s.round_id === round && s.contestant_id === c.id);
      if (rawScoreRec && Number.isFinite(rawScoreRec.total)) { totalPoints += rawScoreRec.total; hasData = true; }
      
      JUDGE_NAMES.forEach(jn => {
        const jRankRec = state.data.judge_rankings.find(r => r.round_id === round && r.contestant_id === c.id && normalizeJudgeName(r.judge_name) === normalizeJudgeName(jn));
        if (jRankRec && Number.isFinite(jRankRec.rank) && jRankRec.rank >= 1) {
          totalPoints += Math.max(0, pointsBase - jRankRec.rank);
          hasData = true;
        }
      });
      if (hasData) out[round][c.id] = totalPoints;
    });
  });
  return out;
}

function getOfficialRankingByRound(isGlobal = false) {
  const targetJudge = isGlobal ? 'overall' : 'official';
  const out = Object.fromEntries(ROUND_ORDER.map(r => [r, {}]));
  
  state.data.judge_rankings.filter(r => normalizeJudgeName(r.judge_name) === targetJudge).forEach(r => {
    if (Number.isFinite(r.rank)) out[r.round_id][r.contestant_id] = r.rank;
  });

  const perfScoresByRound = getPerformanceScoreByRound();
  ROUND_ORDER.forEach(round => {
    const perfScores = perfScoresByRound[round];
    const forceGlobal = isGlobal || round === 'PRERANK' || round === 'FINAL';
    const groups = forceGlobal ? ['all'] : ['theme-sun', 'theme-moon', 'theme-star'];
    
    groups.forEach(group => {
      const groupIds = state.data.contestants.filter(c => (forceGlobal || c.teamClass === group)).map(c => c.id);
      const scoredIds = groupIds.filter(id => !Number.isFinite(out[round][id]) && Number.isFinite(perfScores[id]));
      scoredIds.sort((a, b) => perfScores[b] - perfScores[a]);
      
      let usedRanks = new Set();
      groupIds.forEach(id => { if (Number.isFinite(out[round][id])) usedRanks.add(out[round][id]); });
      
      let autoRank = 1;
      scoredIds.forEach((id) => {
        while (usedRanks.has(autoRank)) autoRank++;
        out[round][id] = autoRank;
        usedRanks.add(autoRank);
      });
    });
  });

  return out;
}

async function loadDataFromRoundTabs() {
  const entries = Object.entries(CONFIG.ROUND_TABS);
  const results = await Promise.all(entries.map(([rid, tab]) => fetchSheetTab(tab).then(rows => [rid, rows])));
  const rowsByRound = Object.fromEntries(results);
  
  const contestantsMap = new Map();
  const judge_rankings = []; const scores = []; const submissions = []; const round_status_clean = [];

  Object.entries(rowsByRound).forEach(([round_id, rows]) => {
    rows.forEach((row) => {
      const name = String(pickValue(row, ['name', 'contestant', 'contestants', 'candidate', 'candidat']) || '').trim();
      if (!name) return;
      const id = normId(name);
      if (EXCLUDED_NAMES.has(id)) return;

      const instagram = String(pickValue(row, ['instagram', 'instagram_handle', 'username']) || '').trim();
      const country = String(pickValue(row, ['country', 'pays', 'origine']) || '').trim();
      const pronouns = String(pickValue(row, ['pronouns', 'pronoms']) || '').trim();
      
      const teamRaw = String(pickValue(row, ['team', 'equipe', 'cercle', 'groupe', 'team_name']) || '').toLowerCase();
      let teamClass = 'theme-global';
      if (teamRaw.includes('sun') || teamRaw.includes('soleil') || teamRaw.includes('neitsu')) teamClass = 'theme-sun';
      else if (teamRaw.includes('moon') || teamRaw.includes('lune') || teamRaw.includes('kaina')) teamClass = 'theme-moon';
      else if (teamRaw.includes('star') || teamRaw.includes('etoile') || teamRaw.includes('étoile') || teamRaw.includes('aya')) teamClass = 'theme-star';

      const performance = String(pickValue(row, ['performance', 'song', 'song_title', 'performance1', 'performance 1']) || '').trim();
      const group_song = String(pickValue(row, ['performance2', 'performance 2']) || '').trim();
      const link = String(pickValue(row, ['link', 'performance_link', 'youtube_url', 'url', 'linktotheperformance', 'linktotheperformance1']) || '').trim();
      const link2 = String(pickValue(row, ['link2', 'linktotheperformance2']) || '').trim();
      
      const officialRank = parseNum(pickValue(row, ['official_rank', 'rank', 'official ranking', 'classement']));
      const overallRank = parseNum(pickValue(row, ['overall_rank', 'overall rank', 'global rank', 'classement global', 'overall']));
      const perfScore = parseNum(pickValue(row, ['performance_score', 'score', 'creator_score', 'total', 'note']));
      
      const statusValueRaw = String(pickValue(row, ['status', 'statut', 'etat']) || '').trim().toLowerCase();
      let statusValue = statusValueRaw;
      if (statusValueRaw.includes('public') || statusValueRaw.includes('balance')) statusValue = 'saved_public';
      else if (statusValueRaw.includes('judge') || statusValueRaw.includes('jury') || statusValueRaw.includes('oracle')) statusValue = 'saved_judges';
      else if (statusValueRaw.includes('1st') || statusValueRaw === 'winner' || statusValueRaw.includes('elu')) statusValue = 'winner';
      else if (statusValueRaw.includes('elim') || statusValueRaw.includes('élim') || statusValueRaw.includes('consum')) statusValue = 'eliminated';
      else if (statusValueRaw.includes('nominee') || statusValueRaw.includes('rouge') || statusValueRaw.includes('ombre') || statusValueRaw.includes('shadow')) statusValue = 'nominee';
      else if (statusValueRaw.includes('safe') || statusValueRaw.includes('droite') || statusValueRaw.includes('or')) statusValue = 'safe';

      if (!contestantsMap.has(id)) {
        contestantsMap.set(id, { id, name, photo_url: `${id}.png`, country, bio: '', instagram, pronouns, teamClass });
      } else {
        const c = contestantsMap.get(id);
        if (country && !c.country) c.country = country;
        if (pronouns && !c.pronouns) c.pronouns = pronouns;
        if (instagram && !c.instagram) c.instagram = instagram;
        if (teamClass !== 'theme-global' && c.teamClass === 'theme-global') c.teamClass = teamClass;
      }
      
      if (Number.isFinite(officialRank)) judge_rankings.push({ round_id, judge_name: 'official', contestant_id: id, rank: officialRank });
      if (Number.isFinite(overallRank)) judge_rankings.push({ round_id, judge_name: 'overall', contestant_id: id, rank: overallRank });
      if (Number.isFinite(perfScore)) scores.push({ round_id, contestant_id: id, total: perfScore });
      if (performance || link) submissions.push({ round_id, contestant_id: id, song_title: performance, group_song: group_song, bandlab_url: link2, youtube_url: link, notes: '' });
      if (statusValue) round_status_clean.push({ round_id, contestant_id: id, status: statusValue });

      JUDGE_NAMES.forEach(jn => {
        const val = parseNum(pickValue(row, [jn, `${jn}_rank`, `${jn} rank`]));
        if (Number.isFinite(val)) judge_rankings.push({ round_id, judge_name: jn, contestant_id: id, rank: val });
      });
    });
  });

  const allIds = [...contestantsMap.keys()];
  let lastStatusObj = {};
  ROUND_ORDER.forEach(round => {
    allIds.forEach(id => {
      const existingIndex = round_status_clean.findIndex(r => r.round_id === round && r.contestant_id === id);
      if (existingIndex >= 0) { lastStatusObj[id] = round_status_clean[existingIndex].status; }
      else if (lastStatusObj[id] === 'eliminated') {
        round_status_clean.push({ round_id: round, contestant_id: id, status: 'eliminated' });
      }
    });
  });

  return { contestants: [...contestantsMap.values()], rounds: [], submissions, scores, judge_rankings, round_status: round_status_clean, votes_live: [] };
}

async function loadData() {
  state.realData = await loadDataFromRoundTabs();
  try {
    let votesRaw = await fetchSheetTab('votes_live', CONFIG.VOTE_SHEET_ID);
    if (!votesRaw || votesRaw.length === 0) votesRaw = await fetchSheetTab('', CONFIG.VOTE_SHEET_ID);
    state.realData.votes_live = (votesRaw || []).map(r => {
      const rid = pickValue(r, ['round_id', 'round', 'roundid', 'a']);
      const cid = pickValue(r, ['contestant_id', 'contestant', 'name', 'candidat', 'b']);
      let vcount = pickValue(r, ['votes_count', 'votes', 'count', 'total', 'c']);
      if (vcount === '' && Object.values(r).length >= 3) vcount = Object.values(r)[2];
      return { round_id: canonicalRoundId(rid), contestant_id: normId(cid), votes_count: parseNum(vcount) || 0 };
    }).filter(v => v.contestant_id && v.round_id && !v.round_id.includes('ROUNDID'));
  } catch (e) { console.warn("Votes non chargés:", e); }
}

function normalizeData() {
  const d = state.data;
  d.contestants = d.contestants.filter(c => c.id && !EXCLUDED_NAMES.has(c.id));
}

function getJudgeRankingByRound(judgeName) {
  const key = normalizeJudgeName(judgeName);
  const out = Object.fromEntries(ROUND_ORDER.map(r => [r, {}]));
  state.data.judge_rankings.filter(r => normalizeJudgeName(r.judge_name) === key).forEach(r => { if (Number.isFinite(r.rank)) out[r.round_id][r.contestant_id] = r.rank; });
  return out;
}

function getRankingViewOptions() {
  return [
    { value: 'default', label: state.activeTeam === 'Global' ? t('overall_rank') : t('official_rank') },
    ...JUDGE_NAMES.map(j => ({ value: `judge:${j}`, label: j })),
    { value: 'performance_score', label: t('perf_score') }
  ];
}

function getRankingMapByView(view) {
  if (view === 'default') return getOfficialRankingByRound(state.activeTeam === 'Global');
  if (view === 'performance_score') return getPerformanceScoreByRound();
  if (view.startsWith('judge:')) return getJudgeRankingByRound(view.split(':')[1]);
  return getOfficialRankingByRound(state.activeTeam === 'Global');
}

function getLatestRound() {
  for (let i = ROUND_ORDER.length - 1; i >= 0; i--) {
    const round = ROUND_ORDER[i];
    if (state.data.scores.some(r => r.round_id === round && Number.isFinite(r.total)) ||
        state.data.judge_rankings.some(r => r.round_id === round && Number.isFinite(r.rank)) ||
        state.data.round_status.some(r => r.round_id === round && r.status !== '' && r.status !== 'eliminated')) {
      return round;
    }
  }
  return 'PRERANK';
}

function sortedContestants() {
  const officialByRound = getOfficialRankingByRound(state.activeTeam === 'Global');
  const current = officialByRound[state.latestRound] || {};
  
  let filtered = state.data.contestants;
  if (state.activeTeam === 'Soleil') filtered = filtered.filter(c => c.teamClass === 'theme-sun');
  if (state.activeTeam === 'Lune') filtered = filtered.filter(c => c.teamClass === 'theme-moon');
  if (state.activeTeam === 'Etoile') filtered = filtered.filter(c => c.teamClass === 'theme-star');
  
  return [...filtered].sort((a, b) => {
    const aElim = getStatus(state.latestRound, a.id) === 'eliminated' ? 1 : 0;
    const bElim = getStatus(state.latestRound, b.id) === 'eliminated' ? 1 : 0;
    if (aElim !== bElim) return aElim - bElim;

    const ar = current[a.id]; const br = current[b.id];
    if (Number.isFinite(ar) && Number.isFinite(br)) return ar - br;
    if (Number.isFinite(ar)) return -1;
    if (Number.isFinite(br)) return 1;
    return String(a.name || '').localeCompare(String(b.name || ''));
  });
}

// Décompte synchronisé sur TOUS les onglets (classes CSS au lieu d'ID unique)
function startGlobalCountdown() {
  clearInterval(countdownInterval);
  const updateClock = () => {
    const now = new Date();
    let targetYear = now.getFullYear();
    let target = new Date(targetYear, 10, 13, 23, 59, 59);
    if (now > target) target = new Date(targetYear + 1, 10, 13, 23, 59, 59);
    const diff = Math.max(0, target - now);
    const d = String(Math.floor(diff / (1000 * 60 * 60 * 24))).padStart(2, '0');
    const h = String(Math.floor((diff / (1000 * 60 * 60)) % 24)).padStart(2, '0');
    const m = String(Math.floor((diff / 1000 / 60) % 60)).padStart(2, '0');
    const s = String(Math.floor((diff / 1000) % 60)).padStart(2, '0');

    document.querySelectorAll('.cd-days').forEach(el => el.textContent = d);
    document.querySelectorAll('.cd-hours').forEach(el => el.textContent = h);
    document.querySelectorAll('.cd-mins').forEach(el => el.textContent = m);
    document.querySelectorAll('.cd-secs').forEach(el => el.textContent = s);
  };
  updateClock();
  countdownInterval = setInterval(updateClock, 1000);
}

function renderContestants() {
  const root = document.getElementById('contestants');
  if (state.data.contestants.length === 0) {
    renderAuditionPortal(root);
    return;
  }
  const currentRanks = getOfficialRankingByRound(state.activeTeam === 'Global')[state.latestRound] || {};
  
  let teamTitle = "";
  if (state.activeTeam === 'Soleil') teamTitle = ` — ✹ ${t('btn_sun')} (Neitsu)`;
  if (state.activeTeam === 'Lune') teamTitle = ` — ☾ ${t('btn_moon')} (Kaina)`;
  if (state.activeTeam === 'Etoile') teamTitle = ` — ✦ ${t('btn_star')} (Aya)`;

  root.innerHTML = `
    <div class="card-paper">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;">
        <div>
          <h2 style="margin-bottom:0.3rem;">${t('welcome_title')}${teamTitle}</h2>
          <p class="small" style="color:var(--tarot-gold); margin:0;">
            ${t('auto_updated')} <span class="chip" style="font-weight:bold; color:var(--bg); background:var(--tarot-gold)">${getRoundLabel(state.latestRound)}</span>
          </p>
        </div>
      </div>
      <div class="filters" style="margin-top:1.5rem;">
        <input id="searchContestant" placeholder="${t('search_ph')}" />
        <select id="statusFilter">
          <option value="all">${t('all_status')}</option>
          <option value="safe">${t('safe')}</option>
          <option value="nominee">${t('nominee')}</option>
          <option value="saved_judges">${t('saved_judges')}</option>
          <option value="saved_public">${t('saved_public')}</option>
          <option value="eliminated">${t('eliminated')}</option>
        </select>
      </div>
    </div>
    <div id="contestantsGrid" class="contestants-grid"></div>
  `;

  const draw = () => {
    const q = document.getElementById('searchContestant').value.toLowerCase().trim();
    const f = document.getElementById('statusFilter').value;
    
    const list = sortedContestants().filter(c => c.name.toLowerCase().includes(q)).filter(c => {
      let status = getStatus(state.latestRound, c.id);
      if (!status && getFirstEliminatedRoundIndex(c.id) !== -1 && getFirstEliminatedRoundIndex(c.id) <= ROUND_ORDER.indexOf(state.latestRound)) status = 'eliminated';
      if (f === 'all') return true;
      return status === f || (f === 'safe' && ['winner', 'second', 'third', 'fourth', 'fifth'].includes(status));
    });

    if (list.length === 0) {
      document.getElementById('contestantsGrid').innerHTML = '<p class="small">' + t('no_contestants') + '</p>';
    } else {
      document.getElementById('contestantsGrid').innerHTML = list.map((c) => {
        let status = getStatus(state.latestRound, c.id);
        const elimRound = getFirstEliminatedRoundIndex(c.id);
        if (!status && elimRound !== -1 && elimRound <= ROUND_ORDER.indexOf(state.latestRound)) status = 'eliminated';

        const rank = currentRanks[c.id];
        const rankDisplay = Number.isFinite(rank) ? 'ARCANE ' + (rank < 10 ? '0' + rank : rank) : 'TBD';
        
        let extraClass = '';
        if (status === 'eliminated') extraClass = 'eliminated';
        else if (status === 'nominee') extraClass = 'danger-zone';
        
        const teamClass = c.teamClass || 'theme-global';
        const imgSrc = (status === 'nominee') ? `${c.id}_shadow.png` : c.photo_url;

        let badgeHtml = '';
        if (status === 'nominee') badgeHtml = `<div class="tarot-badge nominee">${t('nominee')}</div>`;
        else if (status === 'saved_judges') badgeHtml = `<div class="tarot-badge saved_judges">${t('saved_judges')}</div>`;
        else if (status === 'saved_public') badgeHtml = `<div class="tarot-badge saved_public">${t('saved_public')}</div>`;
        else if (status === 'winner') badgeHtml = `<div class="tarot-badge winner">✦ ${t('winner')}</div>`;

        return `
        <div class="tarot-card ${teamClass} ${extraClass}" onclick="location.hash='#profile/${c.id}'">
          <div class="tarot-inner-border">
            <div class="corner corner-tl"></div><div class="corner corner-tr"></div>
            <div class="corner corner-bl"></div><div class="corner corner-br"></div>
            <div class="tarot-top-icon"></div>
            <div class="tarot-name">${getContestantName(c.id)}</div>
            <div class="tarot-image-container">
              <img src="${imgSrc}" data-contestant-id="${c.id}" alt="${c.name}" onerror="handleImageFallback(this)" />
            </div>
            ${badgeHtml}
            <div class="tarot-rank">${rankDisplay}</div>
          </div>
        </div>`;
      }).join('');
    }
  };
  document.getElementById('searchContestant').addEventListener('input', draw);
  document.getElementById('statusFilter').addEventListener('change', draw);
  draw();
}

function renderRankings() {
  const root = document.getElementById('rankings');
  if (state.data.contestants.length === 0) {
    renderAuditionPortal(root);
    return;
  }
  const viewOptions = getRankingViewOptions();
  const rankingMap = getRankingMapByView(state.rankingView);
  const isPerformance = state.rankingView === 'performance_score';
  const activeRound = state.selectedRankingsRound || state.latestRound;

  const list = sortedContestants().sort((a, b) => {
    const aElim = getStatus(activeRound, a.id) === 'eliminated' ? 1 : 0;
    const bElim = getStatus(activeRound, b.id) === 'eliminated' ? 1 : 0;
    if (aElim !== bElim) return aElim - bElim;

    const va = rankingMap[activeRound]?.[a.id]; const vb = rankingMap[activeRound]?.[b.id];
    if (Number.isFinite(va) && Number.isFinite(vb)) { return isPerformance ? vb - va : va - vb; }
    if (Number.isFinite(va)) return -1; if (Number.isFinite(vb)) return 1;
    return String(a.name || '').localeCompare(String(b.name || ''));
  });
  
  const teamIds = list.map(c => c.id);

  const nominations = {
    nominee: state.data.round_status.filter(r => r.round_id === activeRound && r.status === 'nominee' && teamIds.includes(r.contestant_id)),
    saved_judges: state.data.round_status.filter(r => r.round_id === activeRound && r.status === 'saved_judges' && teamIds.includes(r.contestant_id)),
    saved_public: state.data.round_status.filter(r => r.round_id === activeRound && r.status === 'saved_public' && teamIds.includes(r.contestant_id)),
    eliminated: state.data.round_status.filter(r => r.round_id === activeRound && r.status === 'eliminated' && teamIds.includes(r.contestant_id))
  };

  let optionsHtml = viewOptions.map(o => `<option value="${o.value}" ${o.value === state.rankingView ? 'selected' : ''}>${o.label}</option>`).join('');
  let roundsHtml = ROUND_ORDER.map(r => `<option value="${r}" ${r === activeRound ? 'selected' : ''}>${getRoundLabel(r)}</option>`).join('');
  let thRoundsHtml = ROUND_ORDER.map(r => `<th>${getRoundLabel(r)}</th>`).join('');

  let rowsHtml = list.map((c, idx) => {
    let cellsHtml = ROUND_ORDER.map(r => {
      const v = rankingMap[r]?.[c.id];
      const elimIndex = getFirstEliminatedRoundIndex(c.id);
      const isDeadInTable = elimIndex !== -1 && elimIndex < ROUND_ORDER.indexOf(r);
      
      if (Number.isFinite(v)) {
        const displayV = (isPerformance && v % 1 !== 0) ? v.toFixed(1) : v;
        if (!isPerformance && isDeadInTable) {
          return `<td><span style="color:var(--tarot-ash); font-weight:600;">${displayV}</span> <span class="pill eliminated-pill" style="font-size:0.55rem; padding:0.15rem 0.4rem; margin-left:6px;">${t('eliminated')}</span></td>`;
        }
        return `<td>${displayV}</td>`;
      }
      
      let st = getStatus(r, c.id);
      if (st && st !== 'eliminated' && !isDeadInTable) return `<td><span class="pill ${statusClass(st)}" style="font-size:0.68rem; padding:0.15rem 0.5rem;">${statusLabel(st)}</span></td>`;
      if (st === 'eliminated' || isDeadInTable) return `<td><span class="pill eliminated-pill" style="font-size:0.68rem; padding:0.15rem 0.5rem;">${statusLabel('eliminated')}</span></td>`;
      return '<td>—</td>';
    }).join('');
    return `<tr><td>${idx + 1}</td><td><a href="#profile/${c.id}">${getContestantName(c.id)}</a></td>${cellsHtml}</tr>`;
  }).join('');

  root.innerHTML = `
    <div class="card-paper">
      <h2>${t('nav_rankings')}</h2>
      <div class="filters">
        <select id="rankingViewSelect">${optionsHtml}</select>
        <select id="rankingsRoundSelect">${roundsHtml}</select>
      </div>
      <p class="small" style="color:var(--tarot-gold)">${t('rankings_desc')}</p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>${isPerformance ? t('pos') : t('rank')}</th><th>${t('name')}</th>${thRoundsHtml}</tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
      <h3 style="margin-top:2.5rem;">${t('nominations')} (${getRoundLabel(activeRound)})</h3>
      <p class="small"><span style="color:var(--tarot-danger); font-weight:bold;">${t('nominee_lbl')} :</span> ${nominations.nominee.map(x => getContestantName(x.contestant_id)).join(', ') || '—'}</p>
      <p class="small"><span style="color:var(--tarot-gold); font-weight:bold;">${t('saved_judges_lbl')} :</span> ${nominations.saved_judges.map(x => getContestantName(x.contestant_id)).join(', ') || '—'}</p>
      <p class="small"><span style="color:var(--tarot-gold); font-weight:bold;">${t('saved_public_lbl')} :</span> ${nominations.saved_public.map(x => getContestantName(x.contestant_id)).join(', ') || '—'}</p>
      <p class="small"><span style="color:var(--tarot-ash); font-weight:bold;">${t('eliminated_lbl')} :</span> ${nominations.eliminated.map(x => getContestantName(x.contestant_id)).join(', ') || '—'}</p>
    </div>
    <div class="card-paper">
      <h3>${t('global_chart')}</h3>
      <div class="table-wrap">
        <div style="min-width: 600px; height: 360px;">
          <canvas id="rankingChart"></canvas>
        </div>
      </div>
    </div>
  `;

  document.getElementById('rankingViewSelect').addEventListener('change', (e) => { state.rankingView = e.target.value; renderRankings(); });
  document.getElementById('rankingsRoundSelect').addEventListener('change', (e) => { state.selectedRankingsRound = e.target.value; renderRankings(); });

  try {
    if (rankingChartInstance) rankingChartInstance.destroy();
    const ctx = document.getElementById('rankingChart');
    if (!ctx || typeof Chart === 'undefined') return;
    
    Chart.defaults.color = '#888888';
    Chart.defaults.borderColor = '#2E2E2E';

    rankingChartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels: ROUND_ORDER.map(r => getRoundLabel(r)),
        datasets: list.map((c, idx) => {
          const elimIndex = getFirstEliminatedRoundIndex(c.id);
          const isEliminated = getStatus(activeRound, c.id) === 'eliminated';
          const baseColor = colorForIndex(idx);
          const color = isEliminated ? baseColor.replace('hsl', 'hsla').replace(')', ', 0.25)') : baseColor;
          
          return {
            label: getContestantName(c.id),
            data: ROUND_ORDER.map((r, rIdx) => {
              if (elimIndex !== -1 && rIdx > elimIndex) return null;
              const v = rankingMap[r]?.[c.id];
              return Number.isFinite(v) ? v : null;
            }),
            borderColor: color, backgroundColor: color,
            borderWidth: isEliminated ? 1 : 3, borderDash: isEliminated ? [5, 5] : [],
            pointRadius: isEliminated ? 0 : 4, pointHoverRadius: 6, tension: 0.25, spanGaps: true
          };
        })
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: true, position: 'bottom', labels: { color: '#F0EDE5', boxWidth: 10, usePointStyle: true } } },
        scales: {
          x: { ticks: { color: '#888' } },
          y: {
            reverse: !isPerformance,
            min: isPerformance ? undefined : 1,
            max: isPerformance ? undefined : Math.max(16, list.length),
            ticks: { color: '#888', stepSize: isPerformance ? undefined : 1 }
          }
        }
      }
    });
  } catch (err) { console.error("Erreur Graphique:", err); }
}

function renderProfile(contestantId) {
  const c = state.data.contestants.find(x => x.id === contestantId);
  const root = document.getElementById('profile');
  if (!c) { root.innerHTML = `<div class="card-paper"><p>${t('contestant_not_found')}</p></div>`; return; }

  const official = getOfficialRankingByRound(state.activeTeam === 'Global');
  const judgesByName = Object.fromEntries(JUDGE_NAMES.map(j => [j, getJudgeRankingByRound(j)]));
  const perfScore = getPerformanceScoreByRound();

  const profileOrder = sortedContestants();
  const profileIndex = profileOrder.findIndex(x => x.id === c.id);
  const prevContestant = profileIndex > 0 ? profileOrder[profileIndex - 1] : null;
  const nextContestant = profileIndex >= 0 && profileIndex < profileOrder.length - 1 ? profileOrder[profileIndex + 1] : null;
  const submissions = state.data.submissions.filter(s => s.contestant_id === c.id).sort((a,b) => ROUND_ORDER.indexOf(a.round_id) - ROUND_ORDER.indexOf(b.round_id));

  const meta = [
    c.country ? `${t('country')} : ${c.country}` : '',
    c.pronouns ? `${t('pronouns')} : ${c.pronouns}` : '',
    c.instagram ? `${t('instagram')} : <a href="${c.instagram.startsWith('http') ? c.instagram : 'https://instagram.com/' + c.instagram.replace('@', '')}" target="_blank" style="color:var(--tarot-gold)">${c.instagram}</a>` : ''
  ].filter(Boolean).join(' · ');

  let roundsRowsHtml = ROUND_ORDER.map(r => {
    let st = getStatus(r, c.id);
    const elimRound = getFirstEliminatedRoundIndex(c.id);
    if (!st && elimRound !== -1 && elimRound <= ROUND_ORDER.indexOf(r)) st = 'eliminated';
    const pScore = perfScore[r]?.[c.id];
    const rawVocal = state.data.scores.find(s => s.round_id === r && s.contestant_id === c.id)?.total;
    
    let pScoreStr = Number.isFinite(pScore) ? (pScore % 1 === 0 ? pScore.toString() : pScore.toFixed(1)) : '—';
    let vocalStr = Number.isFinite(rawVocal) ? `${rawVocal}/100` : '—';
    
    const jCellsHtml = JUDGE_NAMES.map(j => `<td>${judgesByName[j]?.[r]?.[c.id] ?? '—'}</td>`).join('');
    return `<tr><td><strong>${getRoundLabel(r)}</strong></td><td>${official[r]?.[c.id] ?? '—'}</td>${jCellsHtml}<td>${vocalStr}</td><td><strong style="color:var(--tarot-gold)">${pScoreStr}</strong></td><td><span class="pill ${statusClass(st)}">${statusLabel(st)}</span></td></tr>`;
  }).join('');

  let perfsRowsHtml = submissions.length > 0 ? submissions.map(s => {
    return `<tr>
      <td><strong>${getRoundLabel(s.round_id) || s.round_id}</strong></td>
      <td>${s.song_title || t('tbd')}${s.group_song ? `<br><span style="color:var(--muted); font-size:0.85em">${s.group_song}</span>` : ''}</td>
      <td>
        ${s.youtube_url ? `<a class="btn" style="padding:0.3rem 0.7rem; font-size:0.74rem;" target="_blank" href="${s.youtube_url}">${t('link_perf')}</a>` : '—'}
        ${s.bandlab_url ? ` <a class="btn" style="padding:0.3rem 0.7rem; font-size:0.74rem;" target="_blank" href="${s.bandlab_url}">BandLab</a>` : ''}
      </td>
    </tr>`;
  }).join('') : `<tr><td colspan="3">${t('no_links')}</td></tr>`;

  const dynamicRankLabel = state.activeTeam === 'Global' ? t('overall_rank') : t('official_rank');
  const latestSt = getStatus(state.latestRound, c.id);
  const profileImgSrc = (latestSt === 'nominee') ? `${c.id}_shadow.png` : c.photo_url;

  root.innerHTML = `
    <div class="card-paper">
      <div class="profile-nav">
        <button class="btn" onclick="location.hash='#contestants'">${t('back_contestants')}</button>
        ${prevContestant ? `<button class="btn" onclick="location.hash='#profile/${prevContestant.id}'">← ${getContestantName(prevContestant.id)}</button>` : ''}
        ${nextContestant ? `<button class="btn" onclick="location.hash='#profile/${nextContestant.id}'">${getContestantName(nextContestant.id)} →</button>` : ''}
      </div>
      <div class="row two">
        <div style="display:flex; justify-content:center;">
          <div class="profile-img-wrap ${latestSt === 'nominee' ? 'danger-zone' : ''}">
            <img class="profile-img" src="${profileImgSrc}" data-contestant-id="${c.id}" alt="${c.name}" onerror="handleImageFallback(this)" />
          </div>
        </div>
        <div class="profile-content">
          <h2 style="font-size: clamp(2rem, 4vw, 2.8rem); margin-bottom: 0.4rem;">${getContestantName(c.id)}</h2>
          ${meta ? `<p class="small" style="font-size:1rem; color:var(--tarot-gold)">${meta}</p>` : ''}
          <h3 style="margin-top:2rem;">${t('rounds_overview')}</h3>
          <div class="table-wrap">
            <table>
              <thead><tr><th>${t('round')}</th><th>${dynamicRankLabel}</th>${JUDGE_NAMES.map(j => `<th>${j}</th>`).join('')}<th>Vocal (/100)</th><th>${t('perf_score')}</th><th>${t('status')}</th></tr></thead>
              <tbody>${roundsRowsHtml}</tbody>
            </table>
          </div>
          <h3 style="margin-top:2rem;">${t('performances')}</h3>
          <div class="table-wrap">
            <table>
              <thead><tr><th>${t('round')}</th><th>${t('song')}</th><th>${t('links')}</th></tr></thead>
              <tbody>${perfsRowsHtml}</tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- PENTAGRAMME D'AURA (RADAR) + COURBE D'ÉVOLUTION -->
    <div class="row charts-split">
      <div class="card-paper" style="margin-bottom:0;">
        <h3>${t('radar_chart')} (${getRoundLabel(state.latestRound)})</h3>
        <div style="height: 300px; display:flex; justify-content:center; align-items:center;">
          <canvas id="radarChart"></canvas>
        </div>
      </div>
      <div class="card-paper" style="margin-bottom:0;">
        <h3>${t('indiv_chart')}</h3>

  const r = state.latestRound;
  const maxActive = getActiveCountForRound(r, c.teamClass);
  const rankToPct = (rk) => Number.isFinite(rk) && rk >= 1 ? Math.round(Math.max(15, ((maxActive - rk + 1) / maxActive) * 100)) : 50;
  
  const neitsuPct = rankToPct(judgesByName['Neitsu']?.[r]?.[c.id]);
  const kainaPct  = rankToPct(judgesByName['Kaina']?.[r]?.[c.id]);
  const ayaPct    = rankToPct(judgesByName['Aya']?.[r]?.[c.id]);

  const vocalPct  = state.data.scores.find(s => s.round_id === r && s.contestant_id === c.id)?.total || 75;

function renderVotes() {
  const root = document.getElementById('votes');
  if (state.data.contestants.length === 0) {
    renderAuditionPortal(root);
    return;
  }
  const roundsWithVotes = ROUND_ORDER.filter(r => state.data.votes_live.some(v => v.round_id === r));
  const selected = canonicalRoundId(state.votesRound);
  state.votesRound = ROUND_ORDER.includes(selected) ? selected : (roundsWithVotes[roundsWithVotes.length - 1] || state.latestRound);

  const rule = ROUND_RULES[state.votesRound] || ROUND_RULES.ROUND_1;

  const nominees = state.data.round_status.filter(r => r.round_id === state.votesRound && r.status === 'nominee').map(r => r.contestant_id);
  const votedCandidates = state.data.votes_live.filter(v => v.round_id === state.votesRound).map(v => v.contestant_id);
  
  const activeTeamIds = sortedContestants().map(c => c.id);
  const targets = [...new Set([...nominees, ...votedCandidates])].filter(id => activeTeamIds.includes(id));

  const rows = targets.map(id => {
    const record = state.data.votes_live.find(v => v.round_id === state.votesRound && v.contestant_id === id);
    return { id, name: getContestantName(id), votes: Number(record?.votes_count || 0) };
  }).sort((a, b) => b.votes - a.votes);

  const totalVotes = rows.reduce((sum, r) => sum + r.votes, 0);
  const maxVotes = rows.length > 0 ? rows[0].votes : 0;

  let votesListHtml = rows.length ? rows.map((r, idx) => {
    const pct = totalVotes > 0 ? (r.votes / totalVotes) * 100 : 0;
    const barPct = maxVotes > 0 ? (r.votes / maxVotes) * 100 : 0;
    const inPublicSaveZone = idx < rule.publicSave;
    return `
      <div class="vote-row" style="${inPublicSaveZone ? 'border-color:var(--tarot-gold);' : ''}">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;">
          <div>
            <strong style="font-family:'Cinzel', serif; font-size:1.15rem; color:var(--tarot-gold)">#${idx + 1} ${r.name}</strong>
            ${inPublicSaveZone ? `<span class="pill saved_public" style="margin-left:8px; font-size:0.6rem;">${t('public_save_zone')}</span>` : ''}
          </div>
          <div style="font-weight:600;">${r.votes} ${t('votes').toLowerCase()} (${pct.toFixed(1)}%)</div>
        </div>
        <div class="bar"><span style="width:${barPct}%"></span></div>
      </div>`;
  }).join('') : `<p class="small" style="text-align:center; margin:1.5rem 0;">${t('no_vote_data')}</p>`;

  const scaleHtml = `
    <div class="scale-showcase">
      <svg class="scale-svg" viewBox="0 0 220 130">
        <line x1="110" y1="20" x2="110" y2="115" stroke="#E2B961" stroke-width="3"/>
        <polygon points="85,115 135,115 125,105 95,105" fill="#E2B961"/>
        <circle cx="110" cy="20" r="6" fill="#E2B961"/>
        <g class="scale-beam-group">
          <line x1="35" y1="35" x2="185" y2="35" stroke="#E2B961" stroke-width="3"/>
          <line x1="35" y1="35" x2="20" y2="75" stroke="#E2B961" stroke-width="1.5"/>
          <line x1="35" y1="35" x2="50" y2="75" stroke="#E2B961" stroke-width="1.5"/>
          <path d="M12 75 Q35 90 58 75 Z" fill="rgba(226,185,97,0.3)" stroke="#E2B961" stroke-width="1.5"/>
          <line x1="185" y1="35" x2="170" y2="75" stroke="#E2B961" stroke-width="1.5"/>
          <line x1="185" y1="35" x2="200" y2="75" stroke="#E2B961" stroke-width="1.5"/>
          <path d="M162 75 Q185 90 208 75 Z" fill="rgba(226,185,97,0.3)" stroke="#E2B961" stroke-width="1.5"/>
        </g>
      </svg>
      <div class="scale-quotas">
        <div class="quota-card shadow-quota"><strong>${rule.shadow}</strong><span class="small">${t('quota_shadow')}</span></div>
        <div class="quota-card"><strong>${rule.oracleSave}</strong><span class="small">${t('quota_oracle')}</span></div>
        <div class="quota-card"><strong>${rule.publicSave}</strong><span class="small">${t('quota_public')}</span></div>
        <div class="quota-card"><strong>${rule.elim}</strong><span class="small">${t('quota_elim')}</span></div>
      </div>
    </div>
  `;

  let roundsOptionsHtml = ROUND_ORDER.filter(r => r !== 'PRERANK').map(r => `<option value="${r}" ${r === state.votesRound ? 'selected' : ''}>${getRoundLabel(r)}</option>`).join('');

  // Si un vote est actif (rows.length > 0), les votes s'affichent EN HAUT et la Balance EN DESSOUS.
  const mainVoteContent = rows.length > 0
    ? `<div style="margin-top:2rem;">${votesListHtml}</div>${scaleHtml}`
    : `${scaleHtml}<div style="margin-top:1.5rem;">${votesListHtml}</div>`;

  root.innerHTML = `
    <div class="card-paper">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;">
        <h2>${t('nav_votes')} — ${getRoundLabel(state.votesRound)}</h2>
        <div class="filters" style="margin:0;">
          <select id="votesRoundSelect">${roundsOptionsHtml}</select>
          ${CONFIG.VOTE_FORM_URL ? `<a class="btn btn-primary" target="_blank" rel="noopener noreferrer" href="${CONFIG.VOTE_FORM_URL}">✦ ${t('vote_now')}</a>` : ''}
        </div>
      </div>

      ${mainVoteContent}

      <p class="small" style="margin-top:2rem; color:var(--tarot-gold)">
        ${t('total_votes')} ${totalVotes} · ${t('last_refresh')} ${new Date().toLocaleTimeString(currentLang)}
      </p>
    </div>
  `;

  document.getElementById('votesRoundSelect').addEventListener('change', (e) => { state.votesRound = e.target.value; renderVotes(); });
}

function setupNav() {
  const nav = document.getElementById('nav');
  const tabs = [
    { id: 'contestants', label: t('nav_contestants') },
    { id: 'rankings', label: t('nav_rankings') },
    { id: 'votes', label: t('nav_votes') },
    { id: 'grimoire', label: t('nav_grimoire') }
  ];
  nav.innerHTML = tabs.map(tab => `<a class="nav-link" href="#${tab.id}">${tab.label}</a>`).join('');

  const onHash = () => {
    const hash = location.hash || '';
    if (hash === '' || hash === '#') {
      document.getElementById('app-dashboard').style.display = 'none';
      document.getElementById('app-dashboard').style.opacity = '0';
      document.getElementById('landing-menu').style.display = 'flex';
      document.getElementById('landing-menu').style.opacity = '1';
      document.getElementById('landing-menu').style.transform = 'scale(1)';
      return;
    } else {
      document.getElementById('landing-menu').style.display = 'none';
      document.getElementById('app-dashboard').style.display = 'block';
      document.getElementById('app-dashboard').style.opacity = '1';
    }

    const [page, param] = hash.slice(1).split('/');
    document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
    if (page === 'profile' && param) {
      document.getElementById('profile').classList.add('active');
      renderProfile(param);
    } else {
      const target = document.getElementById(page) ? page : 'contestants';
      document.getElementById(target).classList.add('active');
    }
    document.querySelectorAll('.nav-link').forEach(a => {
      a.classList.toggle('active', a.getAttribute('href') === '#' + page);
    });
  };
  window.removeEventListener('hashchange', onHash);
  window.addEventListener('hashchange', onHash);
  onHash();
}

async function hydrate() {
  await loadData();

async function boot() {
  try {
    document.getElementById('langSelect').value = currentLang;
    updateStaticTranslations();
    updateCircleSwitcherUI();
    setupNav();
    await hydrate();
    renderAll();

    clearTimeout(state.votesTimer);
    state.votesTimer = setInterval(async () => {
      if (!state.isDemoMode) {
        await hydrate();
        renderAll();
      }
    }, CONFIG.REFRESH_MS);
  } catch (error) {
    console.error("Erreur critique au démarrage :", error);
  }
}

boot();
</script>
</body>
</html>
