<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KÆOS PROJECT - L'Académie des Oracles</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,400&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --tarot-bg: #222222;      
      --tarot-gold: #E2B961;    
      --tarot-gold-dim: rgba(226, 185, 97, 0.2);
      --tarot-danger: #D93838;  
      --tarot-danger-dim: rgba(217, 56, 56, 0.4);
      --tarot-ash: #555555;
      --tarot-ash-dark: #151515;

      --bg: #0A0A0A;
      --panel: #1A1A1A;
      --panel2: #2A2A2A;
      --text: #F0EDE5;
      --muted: #888888;
      --line: #444444;
      --accent: #E2B961; 
      --radius: 6px;
    }
    
    * { box-sizing: border-box; }
    
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--tarot-gold); }

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      color: var(--text);
      background-color: var(--bg);
      background-image: radial-gradient(circle at top, #1a1a1a 0%, #000000 100%);
      background-attachment: fixed;
      overflow-x: hidden;
    }
    
    h1, h2, h3 { font-family: 'Playfair Display', serif; color: var(--tarot-gold); font-weight: 600; letter-spacing: 2px;}
    .container { width: min(1300px, 94vw); margin: 0 auto; }
    
    #landing-menu {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 2rem 0; transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .menu-header { text-align: center; margin-bottom: 3rem; color: var(--tarot-gold); }
    .menu-header h1 { font-size: 3.5rem; letter-spacing: 6px; text-transform: uppercase; margin: 0 0 10px 0; text-shadow: 0 0 20px rgba(226, 185, 97, 0.3); }
    .menu-header p { font-family: 'Poppins', sans-serif; font-size: 1rem; letter-spacing: 8px; text-transform: uppercase; margin: 0; color: #888; }
    
    .cards-layout { display: flex; gap: 30px; justify-content: center; flex-wrap: wrap; max-width: 1400px; padding: 20px; }
    
    .card-container { width: 280px; height: 440px; perspective: 1500px; cursor: pointer; }
    .tarot-flip-card { width: 100%; height: 100%; position: relative; transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-style: preserve-3d; }
    .card-container:hover .tarot-flip-card { transform: rotateY(180deg) translateY(-20px); }
    
    .card-face {
      position: absolute; width: 100%; height: 100%; backface-visibility: hidden; 
      background-color: var(--tarot-bg); border: 2px solid var(--tarot-gold); border-radius: 6px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.8); padding: 10px; box-sizing: border-box;
    }
    
    .card-front {
      display: flex; justify-content: center; align-items: center;
      background-image: linear-gradient(var(--tarot-gold) 1px, transparent 1px), linear-gradient(90deg, var(--tarot-gold) 1px, transparent 1px);
      background-size: 20px 20px; background-position: center;
    }
    .card-front::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(34, 34, 34, 0.85); }
    .card-front-inner { position: relative; z-index: 2; width: 85%; height: 90%; border: 1px solid var(--tarot-gold); display: flex; justify-content: center; align-items: center; }
    
    .front-symbol {
      width: 80px; height: 80px; border: 2px solid var(--tarot-gold); border-radius: 50%; background-color: var(--tarot-bg);
      display: flex; justify-content: center; align-items: center; font-size: 2.5rem; color: var(--tarot-gold);
      box-shadow: 0 0 20px rgba(226, 185, 97, 0.2), inset 0 0 15px rgba(226, 185, 97, 0.3); text-shadow: 0 0 15px rgba(226, 185, 97, 0.8);
    }
    
    .card-back { transform: rotateY(180deg); }
    .card-container:hover .card-back { box-shadow: 0 0 30px rgba(226, 185, 97, 0.2), 0 20px 40px rgba(0,0,0,0.9); }

    #app-dashboard { display: none; opacity: 0; transition: opacity 0.8s ease; }
    
    header {
      position: sticky; top: 0; z-index: 30; backdrop-filter: blur(12px);
      background: rgba(10, 10, 10, 0.85); border-bottom: 1px solid var(--tarot-gold-dim); box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .topbar { min-height: 68px; display: flex; align-items: center; justify-content: space-between; gap: .7rem; flex-wrap: wrap; padding: .8rem 0; }
    
    .brand { cursor: pointer; transition: transform 0.3s ease; }
    .brand:hover { transform: scale(1.02); }
    .brand:hover h1 { text-shadow: 0 0 15px var(--tarot-gold); }
    .brand h1 { margin: 0; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 4px; color: var(--tarot-gold); transition: text-shadow 0.3s;}
    .brand p { margin: .2rem 0 0; color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: 2px;}
    
    .nav-wrapper { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    nav { display: flex; gap: .5rem; flex-wrap: wrap; }
    .nav-link {
      text-decoration: none; color: var(--text); background: var(--panel);
      border: 1px solid var(--line); border-radius: 4px; padding: .42rem .74rem; font-size: .84rem;
      transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 1px;
    }
    .nav-link:hover { border-color: var(--tarot-gold); color: var(--tarot-gold); box-shadow: 0 0 10px var(--tarot-gold-dim); }
    .nav-link.active { background: var(--tarot-gold); color: var(--bg); border-color: var(--tarot-gold); font-weight: 600; }
    
    .lang-select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: .35rem .5rem; font-size: .8rem; cursor: pointer; outline: none; font-family: 'Poppins'; }

    main { padding: 2rem 0 4rem; }
    
    @keyframes fadeInSlide { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    .page { display: none; }
    .page.active { display: block; animation: fadeInSlide 0.5s ease forwards; }

    .card-paper {
      background: var(--panel); border: 1px solid var(--tarot-gold); border-radius: 6px; padding: 2rem; margin-bottom: 2rem;
      box-shadow: 0 15px 40px rgba(0,0,0,0.8), inset 0 0 20px rgba(226,185,97,0.05); position: relative;
    }
    
    h2 { font-size: 2rem; text-transform: uppercase;}
    h3 { font-size: 1.4rem; text-transform: uppercase; border-bottom: 1px solid var(--line); padding-bottom: 10px;}
    .small { color: var(--muted); font-size: .82rem; }
    
    .filters { display: flex; flex-wrap: wrap; gap: .8rem; margin-bottom: 1rem; }
    input, select { border-radius: 4px; border: 1px solid var(--line); outline: none; background: var(--bg); color: var(--text); padding: .6rem .8rem; transition: all 0.3s; font-family: 'Poppins'; }
    input:focus, select:focus { border-color: var(--tarot-gold); box-shadow: 0 0 10px var(--tarot-gold-dim); }
    
    .contestants-grid { display: grid; gap: 2rem; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); align-items: center; justify-items: center; padding: 1rem 0; }
    
    .tarot-card {
        width: 280px; height: 420px; background-color: var(--tarot-bg); border: 2px solid var(--tarot-gold);
        border-radius: 6px; padding: 10px; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        cursor: pointer; transition: transform 0.4s ease, box-shadow 0.4s ease;
    }
    .tarot-card:hover { transform: translateY(-10px); box-shadow: 0 25px 50px rgba(0,0,0,0.9), 0 0 25px var(--tarot-gold-dim); z-index: 10;}

    .tarot-inner-border { position: absolute; top: 10px; left: 10px; right: 10px; bottom: 10px; border: 1px solid var(--tarot-gold); display: flex; flex-direction: column; align-items: center; }

    .corner { position: absolute; width: 6px; height: 6px; border: 1px solid var(--tarot-gold); border-radius: 50%; background-color: var(--tarot-bg); }
    .corner-tl { top: -4px; left: -4px; } .corner-tr { top: -4px; right: -4px; }
    .corner-bl { bottom: -4px; left: -4px; } .corner-br { bottom: -4px; right: -4px; }

    .tarot-top-icon { position: absolute; top: -10px; color: var(--tarot-gold); font-size: 14px; background: var(--tarot-bg); padding: 0 8px; }

    .tarot-name {
        color: var(--tarot-gold); font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 600;
        letter-spacing: 4px; text-transform: uppercase; margin-top: 25px; z-index: 2; text-align: center;
        width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 10px;
    }

    .tarot-image-container { position: absolute; top: 80px; width: 100%; height: 230px; display: flex; justify-content: center; align-items: center; }
    .tarot-image-container img { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5)); }

    .tarot-rank {
        position: absolute; bottom: 20px; color: var(--tarot-gold); font-family: 'Playfair Display', serif;
        font-size: 1.1rem; letter-spacing: 3px; text-transform: uppercase; display: flex; align-items: center; gap: 10px;
    }

    .theme-sun .front-symbol::before { content: '✹'; font-size: 2.8rem; }
    .theme-sun .tarot-top-icon::before { content: '✹'; }
    .theme-sun .tarot-rank::before, .theme-sun .tarot-rank::after { content: '✹'; font-size: 0.7rem; }
    
    .theme-moon .front-symbol::before { content: '☾'; font-size: 2.8rem; margin-top: -5px; }
    .theme-moon .tarot-top-icon::before { content: '☾'; font-size: 16px;}
    .theme-moon .tarot-rank::before { content: '☽'; font-size: 0.9rem; }
    .theme-moon .tarot-rank::after { content: '☾'; font-size: 0.9rem; }
    
    .theme-star .front-symbol::before { content: '✦'; font-size: 3rem; }
    .theme-star .tarot-top-icon::before { content: '✦'; }
    .theme-star .tarot-rank::before, .theme-star .tarot-rank::after { content: '✦'; font-size: 0.8rem; }
    
    .theme-global .front-symbol::before { content: '☉'; font-size: 2.8rem; margin-top: -2px;}
    .theme-global .tarot-top-icon::before { content: '☉'; font-size: 16px;}
    .theme-global .tarot-rank::before, .theme-global .tarot-rank::after { content: '☉'; font-size: 0.9rem; }

    .danger-zone { border-color: var(--tarot-danger); }
    .danger-zone:hover { box-shadow: 0 25px 50px rgba(0,0,0,0.9), 0 0 25px var(--tarot-danger-dim); }
    .danger-zone .tarot-inner-border { border-color: var(--tarot-danger); }
    .danger-zone .tarot-name, .danger-zone .tarot-rank, .danger-zone .tarot-top-icon { color: var(--tarot-danger); }
    .danger-zone .corner { border-color: var(--tarot-danger); }

    .eliminated { border-color: var(--tarot-ash); background-color: var(--tarot-ash-dark); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
    .eliminated:hover { transform: translateY(-4px); box-shadow: 0 15px 30px rgba(0,0,0,0.8); }
    .eliminated .tarot-inner-border, .eliminated .corner { border-color: var(--tarot-ash); }
    .eliminated .corner, .eliminated .tarot-top-icon { background-color: var(--tarot-ash-dark); }
    .eliminated .tarot-name, .eliminated .tarot-rank, .eliminated .tarot-top-icon { color: #555; }
    .eliminated .tarot-image-container img { filter: grayscale(100%) contrast(120%) brightness(50%); opacity: 0.8; }

    .pill { display: inline-block; padding: .3rem .8rem; border-radius: 4px; font-size: .75rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; border: 1px solid; }
    .safe { background: transparent; color: var(--tarot-gold); border-color: var(--tarot-gold); }
    .nominee { background: var(--tarot-danger); color: white; border-color: var(--tarot-danger); }
    .saved_judges, .saved_public { background: #3c5466; color: #a4c9e3; border-color: #a4c9e3; }
    .eliminated-pill { background: var(--tarot-ash-dark); color: #888; border-color: var(--tarot-ash); }
    .tbd { background: var(--panel2); color: var(--muted); border-color: var(--line); }
    .winner { background: var(--tarot-gold); color: var(--bg); font-weight: 800; box-shadow: 0 0 15px rgba(226, 185, 97, 0.4); }
    
    .row { display: grid; grid-template-columns: 1fr; gap: 1rem; }
    @media (min-width: 840px) { .row.two { grid-template-columns: 350px 1fr; gap: 3rem; align-items: start; } }
    
    .profile-img-wrap { width: 100%; max-width: 350px; background: var(--tarot-bg); border: 2px solid var(--tarot-gold); border-radius: 6px; padding: 10px; display: flex; justify-content: center; position: relative;}
    .profile-img-wrap::before { content:''; position: absolute; top:5px; left:5px; right:5px; bottom:5px; border: 1px solid var(--tarot-gold); pointer-events: none;}
    .profile-img { width: 100%; height: auto; object-fit: contain; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.8)); z-index: 2;}
    .profile-content { min-width: 0; width: 100%; }
    
    .btn { text-decoration: none; color: var(--tarot-gold); border: 1px solid var(--tarot-gold); background: transparent; border-radius: 4px; padding: .6rem 1.2rem; display: inline-block; cursor: pointer; transition: all 0.3s; font-family: 'Poppins'; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 2px;}
    .btn:hover { background: var(--tarot-gold); color: var(--bg); box-shadow: 0 0 15px var(--tarot-gold-dim); }
    .profile-nav { display: flex; gap: .8rem; align-items: center; flex-wrap: wrap; margin-bottom: 2rem; border-bottom: 1px solid var(--line); padding-bottom: 1rem;}
    
    .table-wrap { overflow-x: auto; margin-bottom: 1rem; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th { font-family: 'Playfair Display'; font-size: 1rem; color: var(--tarot-gold); border-bottom: 2px solid var(--tarot-gold); padding: 1rem .5rem; text-align: left; }
    td { border-bottom: 1px dotted var(--line); padding: 1rem .5rem; text-align: left; white-space: nowrap; }
    .table-wrap a { color: var(--tarot-gold); text-decoration: none; font-weight: 600; transition: color 0.2s;}
    .table-wrap a:hover { color: #fff; text-shadow: 0 0 8px var(--tarot-gold-dim); }
    
    .chip { display: inline-block; border: 1px solid var(--tarot-gold); border-radius: 4px; padding: .2rem .6rem; font-size: .74rem; background: rgba(226,185,97,0.1); font-weight: 600;}
    .vote-row { margin-bottom: 1.5rem; }
    .bar { width: 100%; height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; margin-top: 0.5rem;}
    .bar > span { display: block; height: 100%; background: var(--tarot-gold); transition: width 0.5s ease; box-shadow: 0 0 10px var(--tarot-gold);}

    @media (max-width: 680px) {
      .brand h1 { font-size: 1.2rem; }
      .nav-link { font-size: .76rem; padding: .35rem .6rem; }
      .filters { flex-direction: column; align-items: stretch; gap: .6rem; }
      .card-paper, .card { padding: 1.2rem; }
    }
  </style>
</head>
<body>

<div id="landing-menu">
    <div class="menu-header">
        <h1>Star KCA Academy</h1>
        <p id="menuTagline">KÆOS PROJECT • Choose your destiny</p>
    </div>

    <div class="cards-layout">
        <div class="card-container" onclick="entrerAcademie('Soleil')">
            <div class="tarot-flip-card theme-sun">
                <div class="card-face card-front"><div class="card-front-inner"><div class="front-symbol"></div></div></div>
                <div class="card-face card-back">
                    <div class="tarot-inner-border">
                        <div class="corner corner-tl"></div><div class="corner corner-tr"></div><div class="corner corner-bl"></div><div class="corner corner-br"></div>
                        <div class="tarot-top-icon"></div><div class="tarot-name">NEITSU</div>
                        <div class="tarot-image-container"><img src="neitsu.png" alt="Neitsu" onerror="handleImageFallback(this)"></div>
                        <div class="tarot-rank">THE SUN</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card-container" onclick="entrerAcademie('Lune')">
            <div class="tarot-flip-card theme-moon">
                <div class="card-face card-front"><div class="card-front-inner"><div class="front-symbol"></div></div></div>
                <div class="card-face card-back">
                    <div class="tarot-inner-border">
                        <div class="corner corner-tl"></div><div class="corner corner-tr"></div><div class="corner corner-bl"></div><div class="corner corner-br"></div>
                        <div class="tarot-top-icon"></div><div class="tarot-name">KAINA</div>
                        <div class="tarot-image-container"><img src="kaina.png" alt="Kaina" onerror="handleImageFallback(this)"></div>
                        <div class="tarot-rank">THE MOON</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card-container" onclick="entrerAcademie('Etoile')">
            <div class="tarot-flip-card theme-star">
                <div class="card-face card-front"><div class="card-front-inner"><div class="front-symbol"></div></div></div>
                <div class="card-face card-back">
                    <div class="tarot-inner-border">
                        <div class="corner corner-tl"></div><div class="corner corner-tr"></div><div class="corner corner-bl"></div><div class="corner corner-br"></div>
                        <div class="tarot-top-icon"></div><div class="tarot-name">AYA</div>
                        <div class="tarot-image-container"><img src="aya.png" alt="Aya" onerror="handleImageFallback(this)"></div>
                        <div class="tarot-rank">THE STAR</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card-container" onclick="entrerAcademie('Global')">
            <div class="tarot-flip-card theme-global">
                <div class="card-face card-front"><div class="card-front-inner"><div class="front-symbol"></div></div></div>
                <div class="card-face card-back">
                    <div class="tarot-inner-border">
                        <div class="corner corner-tl"></div><div class="corner corner-tr"></div><div class="corner corner-bl"></div><div class="corner corner-br"></div>
                        <div class="tarot-top-icon"></div><div class="tarot-name">GLOBAL</div>
                        <div class="tarot-image-container"><img src="world.png" alt="Global World" onerror="handleImageFallback(this)"></div>
                        <div class="tarot-rank">THE WORLD</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="app-dashboard">
    <header>
      <div class="container topbar">
        <div class="brand" onclick="retourMenuPrincipale()" title="Return to Selection">
          <h1>KÆOS PROJECT</h1>
          <p id="brandTagline">The Oracles' Academy</p>
        </div>
        <div class="nav-wrapper">
          <nav id="nav"></nav>
          <select id="langSelect" class="lang-select">
            <option value="en">🇬🇧 EN</option>
            <option value="fr">🇫🇷 FR</option>
            <option value="es">🇪🇸 ES</option>
            <option value="de">🇩🇪 DE</option>
            <option value="ja">🇯🇵 JA</option>
            <option value="ko">🇰🇷 KO</option>
            <option value="zh">🇨🇳 ZH</option>
          </select>
        </div>
      </div>
    </header>

    <main class="container">
      <section id="contestants" class="page active"></section>
      <section id="profile" class="page"></section>
      <section id="rankings" class="page"></section>
      <section id="votes" class="page"></section>
    </main>
</div>

<script>
// ==========================================
// ETAT GLOBAL 
// ==========================================
const state = {
 data: { contestants: [], rounds: [], submissions: [], scores: [], judge_rankings: [], round_status: [], votes_live: [] },
 latestRound: "PRERANK", selectedRankingsRound: null, rankingView: "default", votesRound: "PRERANK", votesTimer: null,
 activeTeam: "Global" 
};

// ==========================================
// TRANSITIONS MENU <-> DASHBOARD
// ==========================================
function entrerAcademie(teamFilter) {
    state.activeTeam = teamFilter; 
    state.rankingView = 'default';
    
    const menu = document.getElementById('landing-menu');
    const dashboard = document.getElementById('app-dashboard');
    
    menu.style.opacity = '0';
    menu.style.transform = 'scale(0.95)';
    
    setTimeout(() => {
        menu.style.display = 'none';
        dashboard.style.display = 'block';
        setTimeout(() => {
            dashboard.style.opacity = '1';
            renderContestants(); 
            renderRankings();
            renderVotes();
            location.hash = '#contestants';
        }, 50); 
    }, 800);
}

function retourMenuPrincipale() {
    const menu = document.getElementById('landing-menu');
    const dashboard = document.getElementById('app-dashboard');
    
    dashboard.style.opacity = '0';
    setTimeout(() => {
        dashboard.style.display = 'none';
        menu.style.display = 'flex';
        history.replaceState(null, null, ' '); 
        setTimeout(() => {
            menu.style.opacity = '1';
            menu.style.transform = 'scale(1)';
        }, 50);
    }, 500);
}

// ==========================================
// 1. TRADUCTIONS INTERNATIONALES
// ==========================================
const I18N = {
  en: {
    tagline: "The Oracles' Academy", welcome_title: "The Grand Reading", nav_contestants: "Initiates", nav_rankings: "Alignment", nav_votes: "The Scale",
    search_ph: "Search a soul...", all_status: "All destinies", safe: "Upright Card", nominee: "Shadow Zone", saved_judges: "Oracle's Grace", saved_public: "Scale's Grace", eliminated: "Consumed", tbd: "Unknown",
    winner: "CHOSEN", second: "2ND", third: "3RD", fourth: "4TH", fifth: "5TH", sixth: "6TH", seventh: "7TH",
    auto_updated: "The stars are aligned for the cycle:", no_contestants: "No card found.",
    rank: "Arcana", pos: "Pos", name: "Initiate", rankings_desc: "Aura evolution across cycles.",
    nominations: "The Oracles' Judgment", nominee_lbl: "Shadow Zone", saved_judges_lbl: "Grace (Oracles)", saved_public_lbl: "Grace (Scale)", eliminated_lbl: "Consumed",
    global_chart: "Web of Destiny", perf_score: "Power", official_rank: "Official Arcana", overall_rank: "Global Arcana",
    back_contestants: "← Back to cards", contestant_not_found: "Card lost in limbo.", rounds_overview: "Book of Cycles", round: "Cycle", official: "Arcana", status: "Destiny",

function canonicalRoundId(value) {

 if (!raw) return ''; 
 if (ROUND_ORDER.includes(raw)) return raw;
 if (/^R[1-6]$/.test(raw)) return `ROUND_${raw.slice(1)}`;

function parseCSV(text) {
  const rows = []; let row = []; let inQuotes = false; let val = "";
  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    if (inQuotes) {
      if (char === '"') {
        if (text[i + 1] === '"') { val += '"'; i++; } else { inQuotes = false; }
      } else { val += char; }
    } else {
      if (char === '"') { inQuotes = true; }
      else if (char === ',') { row.push(val); val = ""; }
      else if (char === '\n' || char === '\r') {
        row.push(val); rows.push(row); row = []; val = "";
        if (char === '\r' && text[i + 1] === '\n') i++;
      } else { val += char; }
    }
  }
  if (val !== "" || row.length > 0) { row.push(val); rows.push(row); }
  if (rows.length < 1) return [];
  
  let headerIndex = 0;
  for(let i=0; i<Math.min(5, rows.length); i++){
     if(rows[i].some(c => typeof c === 'string' && ['contestant', 'name', 'candidat', 'eleve', 'username'].some(k => c.toLowerCase().includes(k)))) {
         headerIndex = i; break;
     }
  }
  
  const headers = rows[headerIndex].map(h => String(h).trim().toLowerCase());
  return rows.slice(headerIndex + 1).map(r => {
    const obj = {};
    headers.forEach((h, i) => { if(h) obj[h] = r[i] !== undefined ? String(r[i]).trim() : ''; });
    return obj;
  });
}

async function fetchSheetTab(sheetName, customSheetId = null) {
 const targetId = customSheetId || CONFIG.SHEET_ID;
 if (!targetId) return []; 
 
 const tryFetch = async (name) => {
   const url = `https://docs.google.com/spreadsheets/d/${targetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(name)}&_=${Date.now()}`;
   try {
     const response = await fetch(url);
     if (!response.ok) return null;
     const txt = await response.text();
     if (txt.toLowerCase().includes('<!doctype html>')) return null;
     return parseCSV(txt);
   } catch (e) { return null; }
 };

 let data = await tryFetch(sheetName);
 if (!data) data = await tryFetch(sheetName.toLowerCase());
 if (!data) data = await tryFetch(sheetName + ' ');
 if (!data && sheetName.match(/^R\d$/)) {
     const num = sheetName.replace('R', '');
     data = await tryFetch(`Round ${num}`) || await tryFetch(`Round_${num}`) || await tryFetch(`ROUND ${num}`) || await tryFetch(`R${num} `);
 }
 if (!data && sheetName === 'R6') data = await tryFetch('FINAL') || await tryFetch('Finale') || await tryFetch('FINALE');
 return data || [];
}

async function fetchOptionalSheetTab(sheetName, customSheetId = null) { return await fetchSheetTab(sheetName, customSheetId); }
function keyNorm(k) { return String(k || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
function pickValue(row, aliases) {
 const keys = Object.keys(row);
 for (const a of aliases) {
   const n = keyNorm(a); 
   const real = keys.find(k => keyNorm(k) === n);
   if (real != null && row[real] !== null && row[real] !== undefined && String(row[real]).trim() !== '' && String(row[real]).toLowerCase() !== 'nan') return row[real];
 }
 return '';
}
function parseNum(val) {
 if (val === '' || val === null || val === undefined) return NaN;
 const num = Number(String(val).replace(/\s/g, '').replace(',', '.'));
 return isNaN(num) ? NaN : num;
}

// 🔴 COMPTE LE NOMBRE D'ACTIFS DANS LE CERCLE POUR CALCULER LES POINTS JUGES
function getActiveCountForRound(roundId, teamClass) {
    const rIdx = ROUND_ORDER.indexOf(roundId);
    let count = 0;
    state.data.contestants.forEach(c => {
        if (teamClass && c.teamClass !== teamClass) return; // Uniquement les filles de la même équipe
        const elimIdx = getFirstEliminatedRoundIndex(c.id);
        if (elimIdx === -1 || elimIdx >= rIdx) count++;
    });
    return count > 0 ? count : (teamClass ? 16 : 48); // Fallback logique
}

    ROUND_ORDER.forEach(round => {
        state.data.contestants.forEach(c => {
            // Nombre de filles en vie DANS LE CERCLE DE LA FILLE
            const activeCount = getActiveCountForRound(round, c.teamClass); 
            const pointsBase = activeCount + 1; // ex: 16 actives -> Base 17. Le 1er prend 17-1 = 16 points.

            let totalPoints = 0; let hasData = false;
            
            // Le "Score" sur 100
            const rawScoreRec = state.data.scores.find(s => s.round_id === round && s.contestant_id === c.id);
            if (rawScoreRec && Number.isFinite(rawScoreRec.total)) { totalPoints += rawScoreRec.total; hasData = true; }
            
            // Les points des 4 juges
            JUDGE_NAMES.forEach(jn => {
                const jRankRec = state.data.judge_rankings.find(r => r.round_id === round && r.contestant_id === c.id && normalizeJudgeName(r.judge_name) === normalizeJudgeName(jn));
                if (jRankRec && Number.isFinite(jRankRec.rank) && jRankRec.rank >= 1) {
                    totalPoints += Math.max(0, pointsBase - jRankRec.rank); // Système de points adaptatifs !
                    hasData = true;
                }
            });
            if (hasData) out[round][c.id] = totalPoints;
        });
    });
    return out;
}

function getOfficialRankingByRound(isGlobal = false) {
    const targetJudge = isGlobal ? 'overall' : 'official'; // Cherche official_rank ou overall_rank
    const out = Object.fromEntries(ROUND_ORDER.map(r => [r, {}]));
    
    // 1. Force les rangs définis dans l'Excel
    state.data.judge_rankings.filter(r => normalizeJudgeName(r.judge_name) === targetJudge).forEach(r => { 
        if (Number.isFinite(r.rank)) out[r.round_id][r.contestant_id] = r.rank; 
    });

    // 2. Calcule automatiquement pour ceux qui manquent
    const perfScoresByRound = getPerformanceScoreByRound();
    ROUND_ORDER.forEach(round => {
        const perfScores = perfScoresByRound[round];
        const groups = isGlobal ? ['all'] : ['theme-sun', 'theme-moon', 'theme-star'];
        
        groups.forEach(group => {
            const groupIds = state.data.contestants.filter(c => (isGlobal || c.teamClass === group)).map(c => c.id);
            const scoredIds = groupIds.filter(id => !Number.isFinite(out[round][id]) && Number.isFinite(perfScores[id]));
            scoredIds.sort((a, b) => perfScores[b] - perfScores[a]);
            
            let usedRanks = new Set();
            groupIds.forEach(id => { if (Number.isFinite(out[round][id])) usedRanks.add(out[round][id]); });
            
            let autoRank = 1;
            scoredIds.forEach((id) => {
                while(usedRanks.has(autoRank)) autoRank++;
                out[round][id] = autoRank;
                usedRanks.add(autoRank);
            });
        });
    });

    // 3. Glissement des éliminées (option de sécurité)
    const finalHistoricalRanks = {};
    const groups = isGlobal ? ['all'] : ['theme-sun', 'theme-moon', 'theme-star'];
    groups.forEach(group => {
        let availableBottomRank = isGlobal ? state.data.contestants.length : state.data.contestants.filter(c => c.teamClass === group).length;
        ROUND_ORDER.forEach(round => {
            const newlyEliminated = state.data.contestants.filter(c => (isGlobal || c.teamClass === group) && getFirstEliminatedRoundIndex(c.id) === ROUND_ORDER.indexOf(round));
            if (newlyEliminated.length > 0) {
                newlyEliminated.sort((a, b) => (out[round][a.id] || 999) - (out[round][b.id] || 999));
                const startRank = availableBottomRank - newlyEliminated.length + 1;
                newlyEliminated.forEach((c, idx) => finalHistoricalRanks[c.id] = startRank + idx);
                availableBottomRank -= newlyEliminated.length;
            }
        });
    });

    ROUND_ORDER.forEach((round, rIdx) => {
        state.data.contestants.forEach(c => {
            const elimIdx = getFirstEliminatedRoundIndex(c.id);
            if (elimIdx !== -1 && finalHistoricalRanks[c.id] && rIdx > elimIdx) out[round][c.id] = finalHistoricalRanks[c.id];
        });
    });
    return out;
}

async function loadDataFromRoundTabs() {
 const rowsByRound = {};
 for (const [rid, tab] of Object.entries(CONFIG.ROUND_TABS)) { rowsByRound[rid] = await fetchOptionalSheetTab(tab); }
 
 const contestantsMap = new Map();
 const judge_rankings = []; const scores = []; const submissions = []; const round_status_clean = [];

 Object.entries(rowsByRound).forEach(([round_id, rows]) => {
   rows.forEach((row) => {
     const name = String(pickValue(row, ['name', 'contestant', 'contestants', 'candidate']) || '').trim(); 
     if (!name) return;
     const id = normId(name);
     if (EXCLUDED_NAMES.has(id)) return;

     const instagram = String(pickValue(row, ['instagram', 'instagram_handle', 'username']) || '').trim();
     const country = String(pickValue(row, ['country', 'pays', 'origine']) || '').trim();
     const pronouns = String(pickValue(row, ['pronouns', 'pronoms']) || '').trim();
     
     const teamRaw = String(pickValue(row, ['team', 'equipe', 'cercle', 'groupe', 'team_name']) || '').toLowerCase();
     let teamClass = 'theme-global';
     if (teamRaw.includes('sun') || teamRaw.includes('soleil') || teamRaw.includes('neitsu') || teamRaw.includes('rouge')) teamClass = 'theme-sun';
     else if (teamRaw.includes('moon') || teamRaw.includes('lune') || teamRaw.includes('kaina') || teamRaw.includes('bleu')) teamClass = 'theme-moon';
     else if (teamRaw.includes('star') || teamRaw.includes('etoile') || teamRaw.includes('aya') || teamRaw.includes('violet')) teamClass = 'theme-star';

     const performance = String(pickValue(row, ['performance', 'song', 'song_title', 'performance1', 'performance 1']) || '').trim();
     const group_song = String(pickValue(row, ['performance2', 'performance 2']) || '').trim();
     const link = String(pickValue(row, ['link', 'performance_link', 'youtube_url', 'url', 'linktotheperformance', 'linktotheperformance1']) || '').trim();
     const link2 = String(pickValue(row, ['link2', 'linktotheperformance2']) || '').trim();
     
     const officialRank = parseNum(pickValue(row, ['official_rank', 'rank', 'official ranking', 'classement']));
     const overallRank = parseNum(pickValue(row, ['overall_rank', 'overall rank', 'global rank', 'classement global', 'overall']));
     const perfScore = parseNum(pickValue(row, ['performance_score', 'score', 'creator_score', 'total', 'note']));
     
     const statusValueRaw = String(pickValue(row, ['status', 'statut', 'etat']) || '').trim().toLowerCase();
     let statusValue = statusValueRaw;
     if (statusValueRaw.includes('public')) statusValue = 'saved_public';
     else if (statusValueRaw.includes('judge') || statusValueRaw.includes('jury') || statusValueRaw.includes('oracle')) statusValue = 'saved_judges';
     else if (statusValueRaw.includes('1st') || statusValueRaw === 'winner' || statusValueRaw === '1') statusValue = 'winner';
     else if (statusValueRaw.includes('2nd') || statusValueRaw === '2') statusValue = 'second';
     else if (statusValueRaw.includes('3rd') || statusValueRaw === '3') statusValue = 'third';
     else if (statusValueRaw.includes('elim') || statusValueRaw.includes('élim') || statusValueRaw.includes('consumée')) statusValue = 'eliminated';
     else if (statusValueRaw.includes('nominee') || statusValueRaw.includes('rouge') || statusValueRaw.includes('ombre')) statusValue = 'nominee';
     else if (statusValueRaw.includes('safe') || statusValueRaw.includes('droite')) statusValue = 'safe';

     if (!contestantsMap.has(id)) {
         contestantsMap.set(id, { id, name, photo_url: `${id}.png`, country, bio: '', instagram, pronouns, teamClass });
     } else {
         const c = contestantsMap.get(id);
         if (country && !c.country) c.country = country;
         if (pronouns && !c.pronouns) c.pronouns = pronouns;
         if (instagram && !c.instagram) c.instagram = instagram;
         if (teamClass !== 'theme-global' && c.teamClass === 'theme-global') c.teamClass = teamClass; 
     }
     
     if (Number.isFinite(officialRank)) judge_rankings.push({ round_id, judge_name: 'official', contestant_id: id, rank: officialRank });
     if (Number.isFinite(overallRank)) judge_rankings.push({ round_id, judge_name: 'overall', contestant_id: id, rank: overallRank });
     if (Number.isFinite(perfScore)) scores.push({ round_id, contestant_id: id, total: perfScore });
     if (performance || link) submissions.push({ round_id, contestant_id: id, song_title: performance, group_song: group_song, bandlab_url: link2, youtube_url: link, notes: '' });
     if (statusValue) round_status_clean.push({ round_id, contestant_id: id, status: statusValue });

     JUDGE_NAMES.forEach(jn => {
       const val = parseNum(pickValue(row, [jn, `${jn}_rank`, `${jn} rank`]));
       if (Number.isFinite(val)) judge_rankings.push({ round_id, judge_name: jn, contestant_id: id, rank: val });
     });
   });
 });

 const allIds = [...contestantsMap.keys()];
 let lastStatusObj = {};
 ROUND_ORDER.forEach(round => {
     allIds.forEach(id => {
         const existingIndex = round_status_clean.findIndex(r => r.round_id === round && r.contestant_id === id);
         if (existingIndex >= 0) { lastStatusObj[id] = round_status_clean[existingIndex].status; } 
         else {
             if (lastStatusObj[id] === 'eliminated') round_status_clean.push({ round_id: round, contestant_id: id, status: 'eliminated' });
         }
     });
 });

 return { contestants: [...contestantsMap.values()], rounds: [], submissions, scores, judge_rankings, round_status: round_status_clean, votes_live: [] };
}

function normalizeData() {
 const d = state.data;
 d.contestants = d.contestants.filter(c => c.id && !EXCLUDED_NAMES.has(c.id));
 const contestantsById = new Map();
 d.contestants.forEach((c) => {
   if (!contestantsById.has(c.id)) { contestantsById.set(c.id, c); return; }
   const existing = contestantsById.get(c.id);
   contestantsById.set(c.id, { ...existing, name: existing.name || c.name, instagram: existing.instagram || c.instagram, teamClass: existing.teamClass || c.teamClass });
 });
 d.contestants = [...contestantsById.values()];
}

function getLatestRound() {
 for (let i = ROUND_ORDER.length - 1; i >= 0; i--) {
   const round = ROUND_ORDER[i];
   if (state.data.scores.some(r => r.round_id === round && Number.isFinite(r.total)) ||
       state.data.judge_rankings.some(r => r.round_id === round && normalizeJudgeName(r.judge_name) === 'official') ||
       state.data.judge_rankings.some(r => r.round_id === round && Number.isFinite(r.rank)) ||
       state.data.round_status.some(r => r.round_id === round && r.status !== '' && r.status !== 'eliminated') ||
       state.data.submissions.some(r => r.round_id === round && (r.song_title || r.youtube_url))) {
     return round;
   }
 }
 return 'PRERANK';
}

function sortedContestants() {
 const officialByRound = getOfficialRankingByRound(state.activeTeam === 'Global');
 const current = officialByRound[state.latestRound] || {};
 
 let filtered = state.data.contestants;
 if (state.activeTeam === 'Soleil') filtered = filtered.filter(c => c.teamClass === 'theme-sun');
 if (state.activeTeam === 'Lune') filtered = filtered.filter(c => c.teamClass === 'theme-moon');
 if (state.activeTeam === 'Etoile') filtered = filtered.filter(c => c.teamClass === 'theme-star');
 
 return [...filtered].sort((a, b) => {
   const aElim = getStatus(state.latestRound, a.id) === 'eliminated' ? 1 : 0;
   const bElim = getStatus(state.latestRound, b.id) === 'eliminated' ? 1 : 0;
   if (aElim !== bElim) return aElim - bElim;

   const ar = current[a.id]; const br = current[b.id];
   if (Number.isFinite(ar) && Number.isFinite(br)) return ar - br;
   if (Number.isFinite(ar)) return -1;
   if (Number.isFinite(br)) return 1;
   return String(a.name || '').localeCompare(String(b.name || ''));
 });
}

                 return Number.isFinite(v) ? v : null; 
             }), 
             borderColor: color, backgroundColor: color, 
             borderWidth: isEliminated ? 1 : 3, borderDash: isEliminated ? [5, 5] : [], 
             pointRadius: isEliminated ? 0 : 3, pointHoverRadius: 6, tension: .25, spanGaps: true, order: isEliminated ? 2 : 1 
           };
         })
       },
       options: {
         responsive: true, maintainAspectRatio: false,
         interaction: { mode: 'dataset', intersect: true },
         onHover: (e, elements, chart) => {
           if (elements && elements.length) {
             const hoveredIdx = elements[0].datasetIndex;
             chart.data.datasets.forEach((ds, i) => {
               const isHovered = i === hoveredIdx;
               const isElim = getStatus(activeRound, list[i]?.id) === 'eliminated';
               ds.borderColor = isHovered ? colorForIndex(i) : 'rgba(136, 136, 136, 0.1)';
               ds.borderWidth = isHovered ? 5 : (isElim ? 1 : 2);
               ds.order = isHovered ? 0 : 1;
             });
             chart.update('none');
           } else {
             chart.data.datasets.forEach((ds, i) => {
               const isElim = getStatus(activeRound, list[i]?.id) === 'eliminated';
               const baseCol = colorForIndex(i);
               ds.borderColor = isElim ? baseCol.replace('hsl', 'hsla').replace(')', ', 0.2)') : baseCol;
               ds.borderWidth = isElim ? 1 : 3;
               ds.order = isElim ? 2 : 1;
             });
             chart.update('none');
           }
         },
         plugins: { legend: { display: true, position: 'bottom', labels: { color: '#F0EDE5', boxWidth: 10, usePointStyle: true, pointStyle: 'circle' } } },
         scales: {
             x: { ticks: { color: '#888' } },
             y: {
                 reverse: !isPerformance,
                 min: isPerformance ? undefined : 1,
                 max: isPerformance ? undefined : Math.max(22, list.length),
                 ticks: { color: '#888', stepSize: isPerformance ? undefined : 1 },
                 title: isPerformance ? { display: true, text: t('perf_score'), color: '#888' } : { display: false }
             }
         }
       }
     });
 } catch (err) { console.error("Erreur Graphique:", err); }
}

function renderProfile(contestantId) {
 const c = state.data.contestants.find(x => x.id === contestantId);
 const root = document.getElementById('profile');
 if (!c) { root.innerHTML = '<div class="card-paper"><p>' + t('contestant_not_found') + '</p></div>'; return; }

 const official = getOfficialRankingByRound(state.activeTeam === 'Global');
 const judgesByName = Object.fromEntries(JUDGE_NAMES.map(j => [j, getJudgeRankingByRound(j)]));
 const perfScore = getPerformanceScoreByRound();

 const profileOrder = sortedContestants();
 const profileIndex = profileOrder.findIndex(x => x.id === c.id);
 const prevContestant = profileIndex > 0 ? profileOrder[profileIndex - 1] : null;
 const nextContestant = profileIndex >= 0 && profileIndex < profileOrder.length - 1 ? profileOrder[profileIndex + 1] : null;
 const submissions = state.data.submissions.filter(s => s.contestant_id === c.id).sort((a,b) => ROUND_ORDER.indexOf(a.round_id) - ROUND_ORDER.indexOf(b.round_id));

 const meta = [
   c.country ? t('country') + ': ' + c.country : '',
   c.pronouns ? t('pronouns') + ': ' + c.pronouns : '',
   c.instagram ? t('instagram') + ': <a href="' + (c.instagram.startsWith('http') ? c.instagram : 'https://instagram.com/' + c.instagram.replace('@', '')) + '" target="_blank" style="color:var(--tarot-gold)">' + c.instagram + '</a>' : ''
 ].filter(Boolean).join(' · ');

 let roundsRowsHtml = ROUND_ORDER.map(r => {
     let st = getStatus(r, c.id);
     const elimRound = getFirstEliminatedRoundIndex(c.id);
     if (!st && elimRound !== -1 && elimRound <= ROUND_ORDER.indexOf(r)) st = 'eliminated';
     const pScore = perfScore[r]?.[c.id];
     
     let pScoreStr = '—';
     if (Number.isFinite(pScore)) { pScoreStr = pScore % 1 === 0 ? pScore.toString() : pScore.toFixed(1); }
     
     const jCellsHtml = JUDGE_NAMES.map(j => '<td>' + (judgesByName[j]?.[r]?.[c.id] ?? '—') + '</td>').join('');
     return '<tr><td><strong>' + getRoundLabel(r) + '</strong></td><td>' + (official[r]?.[c.id] ?? '—') + '</td>' + jCellsHtml + '<td><span style="color:var(--tarot-gold)">' + pScoreStr + '</span></td><td><span class="pill ' + statusClass(st) + '">' + statusLabel(st) + '</span></td></tr>';
 }).join('');

 let perfsRowsHtml = submissions.length > 0 ? submissions.map(s => {
     return '<tr>' +
     '<td><strong>' + (getRoundLabel(s.round_id) || s.round_id) + '</strong></td>' +
     '<td>' + (s.song_title || t('tbd')) + (s.group_song ? '<br><span style="color:var(--muted); font-size:0.85em">' + s.group_song + '</span>' : '') + '</td>' +
     '<td>' +
     (s.youtube_url ? '<a target="_blank" href="' + s.youtube_url + '">[' + t('link_perf') + ']</a>' : '—') +
     (s.bandlab_url ? '<br><a target="_blank" href="' + s.bandlab_url + '">[' + t('link_perf') + ']</a>' : '') +
     '</td>' +
     '</tr>';
 }).join('') : '<tr><td colspan="3">' + t('no_links') + '</td></tr>';

 const dynamicRankLabel = state.activeTeam === 'Global' ? t('overall_rank') : t('official_rank');

 root.innerHTML = '<div class="card-paper">' +
 '<div class="profile-nav">' +
 '<button class="btn" onclick="location.hash=\'#contestants\'">' + t('back_contestants') + '</button>' +
 (prevContestant ? '<button class="btn" onclick="location.hash=\'#profile/' + prevContestant.id + '\'">← ' + getContestantName(prevContestant.id) + '</button>' : '') +
 (nextContestant ? '<button class="btn" onclick="location.hash=\'#profile/' + nextContestant.id + '\'">' + getContestantName(nextContestant.id) + ' →</button>' : '') +
 '</div>' +
 '<div class="row two" style="margin-top:2rem">' +
 '<div style="display:flex; justify-content:center;"><div class="profile-img-wrap"><img class="profile-img" src="' + c.photo_url + '" data-contestant-id="' + c.id + '" alt="' + c.name + '" onerror="handleImageFallback(this)" /></div></div>' +
 '<div class="profile-content">' +
 '<h2 style="font-size: clamp(2rem, 5vw, 3rem); margin-top:0; margin-bottom: 0.5rem; word-break: break-word;">' + getContestantName(c.id) + '</h2>' +
 (meta ? '<p class="small" style="font-size:1.1rem; color:var(--tarot-gold)">' + meta + '</p>' : '') +
 '<h3 style="margin-top:3rem;">' + t('rounds_overview') + '</h3>' +
 '<div class="table-wrap">' +
 '<table>' +
 '<thead><tr><th>' + t('round') + '</th><th>' + dynamicRankLabel + '</th>' + JUDGE_NAMES.map(j => '<th>' + j + '</th>').join('') + '<th>' + t('perf_score') + '</th><th>' + t('status') + '</th></tr></thead>' +
 '<tbody>' + roundsRowsHtml + '</tbody>' +
 '</table>' +
 '</div>' +
 '<h3 style="margin-top:3rem;">' + t('performances') + '</h3>' +
 '<div class="table-wrap">' +
 '<table>' +
 '<thead><tr><th>' + t('round') + '</th><th>' + t('song') + '</th><th>' + t('links') + '</th></tr></thead>' +
 '<tbody>' + perfsRowsHtml + '</tbody>' +
 '</table>' +
 '</div>' +
 '</div>' +
 '</div>' +
 '</div>' +
 '<div class="card-paper">' +
 '<h3>' + t('indiv_chart') + '</h3>' +
 '<div class="table-wrap">' +
 '<div style="min-width: 500px; height: 300px;">' +
 '<canvas id="profileChart"></canvas>' +
 '</div>' +
 '</div>' +
 '</div>';

 const elimIndex = getFirstEliminatedRoundIndex(c.id);

 try {
     if (profileChart) profileChart.destroy();
     const ctx2 = document.getElementById('profileChart');
     if (!ctx2 || typeof Chart === 'undefined') return;

     profileChart = new Chart(ctx2, {
       type: 'line',
       data: {
         labels: ROUND_ORDER.map(r => getRoundLabel(r)),
         datasets: [{ 
           label: getContestantName(c.id), 
           data: ROUND_ORDER.map((r, rIdx) => {
               if (elimIndex !== -1 && rIdx > elimIndex) return null;
               const v = official[r]?.[c.id]; 
               return Number.isFinite(v) ? v : null;
           }), 
           borderColor: '#E2B961', backgroundColor: 'rgba(226, 185, 97, 0.1)', borderWidth: 3, tension: .25, spanGaps: true 
         }]
       },
       options: {
         responsive: true, maintainAspectRatio: false,
         plugins: { legend: { labels: { color: '#F0EDE5' } } },
         scales: { 
             x: { ticks: { color: '#888' } }, 
             y: { 
                 reverse: true, min: 1, max: Math.max(22, state.data.contestants.length), 
                 ticks: { color: '#888', stepSize: 1 } 
             } 
         }
       }
     });
 } catch (err) {}
}

function renderVotes() {
 const root = document.getElementById('votes');
 if (state.data.contestants.length === 0) {
   root.innerHTML = '<div class="card-paper" style="text-align: center; padding: 4rem 2rem;"><h2>' + t('opening_soon') + '</h2></div>'; return;
 }
 const roundsWithVotes = ROUND_ORDER.filter(r => state.data.votes_live.some(v => v.round_id === r));
 const selected = canonicalRoundId(state.votesRound);
 state.votesRound = ROUND_ORDER.includes(selected) ? selected : (roundsWithVotes[roundsWithVotes.length - 1] || state.latestRound);

 const nominees = state.data.round_status.filter(r => r.round_id === state.votesRound && r.status === 'nominee').map(r => r.contestant_id);
 const votedCandidates = state.data.votes_live.filter(v => v.round_id === state.votesRound).map(v => v.contestant_id);
 
 const activeTeamIds = sortedContestants().map(c => c.id);
 const targets = [...new Set([...nominees, ...votedCandidates])].filter(id => activeTeamIds.includes(id));

 const rows = targets.map(id => {
   const record = state.data.votes_live.find(v => v.round_id === state.votesRound && v.contestant_id === id);
   return { id, name: getContestantName(id), votes: Number(record?.votes_count || 0), updated: record?.last_updated || '-' };
 }).sort((a, b) => b.votes - a.votes);

 const totalVotes = rows.reduce((sum, r) => sum + r.votes, 0);
 const maxVotes = rows.length > 0 ? rows[0].votes : 0;

 let votesListHtml = rows.length ? rows.map(r => {
   const pct = totalVotes > 0 ? (r.votes / totalVotes) * 100 : 0;
   const barPct = maxVotes > 0 ? (r.votes / maxVotes) * 100 : 0;
   return '<div class="vote-row"><div><strong style="font-family:\'Playfair Display\'; font-size:1.2rem; color:var(--tarot-gold)">' + r.name + '</strong> — ' + r.votes + ' ' + t('votes').toLowerCase() + ' (' + pct.toFixed(1) + '%)</div><div class="bar"><span style="width:' + barPct + '%"></span></div></div>';
 }).join('') : '<p>' + t('no_vote_data') + '</p>' + (roundsWithVotes.length ? '<p class="small">' + t('avail_vote_rounds') + ' ' + roundsWithVotes.map(r => getRoundLabel(r)).join(', ') + '</p>' : '');

 let roundsOptionsHtml = ROUND_ORDER.map(r => '<option value="' + r + '" ' + (r===state.votesRound?'selected':'') + '>' + getRoundLabel(r) + '</option>').join('');

 root.innerHTML = '<div class="card-paper">' +
 '<h2>' + t('nav_votes') + '</h2>' +
 '<div class="filters">' +
 '<select id="votesRoundSelect">' + roundsOptionsHtml + '</select>' +
 (CONFIG.VOTE_FORM_URL ? '<a class="btn" target="_blank" rel="noopener noreferrer" href="' + CONFIG.VOTE_FORM_URL + '">' + t('vote_now') + '</a>' : '') +
 '</div>' +
 '<div style="margin-top:3rem;">' + votesListHtml + '</div>' +
 '<p class="small" style="margin-top:3rem; color:var(--tarot-gold)">' + t('total_votes') + ' ' + totalVotes + ' · ' + t('last_refresh') + ' ' + new Date().toLocaleString(currentLang) + '</p>' +
 '</div>';

 document.getElementById('votesRoundSelect').addEventListener('change', (e) => { state.votesRound = e.target.value; renderVotes(); });
 clearTimeout(state.votesTimer);
 state.votesTimer = setTimeout(async () => { await hydrate(); renderContestants(); renderRankings(); renderVotes(); }, CONFIG.REFRESH_MS);
}

function setupNav() {
 const nav = document.getElementById('nav');
 const tabs = [{id:'contestants', label: t('nav_contestants')}, {id:'rankings', label: t('nav_rankings')}, {id:'votes', label: t('nav_votes')}];
 nav.innerHTML = tabs.map(t => '<a class="nav-link" href="#' + t.id + '">' + t.label + '</a>').join('');

 const onHash = () => {
   const hash = location.hash || ''; 
   
   if(hash === '' || hash === '#') {
       document.getElementById('app-dashboard').style.display = 'none';
       document.getElementById('app-dashboard').style.opacity = '0';
       document.getElementById('landing-menu').style.display = 'flex';
       document.getElementById('landing-menu').style.opacity = '1';
       document.getElementById('landing-menu').style.transform = 'scale(1)';
       return;
   } else {
       document.getElementById('landing-menu').style.display = 'none';
       document.getElementById('app-dashboard').style.display = 'block';
       document.getElementById('app-dashboard').style.opacity = '1';
   }

   const [page] = hash.slice(1).split('/');
   document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
   if (page === 'profile') {
     document.getElementById('profile').classList.add('active');
     renderProfile(hash.split('/')[1]);
   } else if (page) {
     const target = document.getElementById(page) ? page : 'contestants';
     const targetEl = document.getElementById(target);
     if(targetEl) targetEl.classList.add('active');
   }
   document.querySelectorAll('.nav-link').forEach(a => {
       if (a.getAttribute('href') === '#' + page) a.classList.add('active');
       else a.classList.remove('active');
   });
 };
 window.removeEventListener('hashchange', onHash);
 window.addEventListener('hashchange', onHash);
 onHash();
}

async function hydrate() {
 await loadData(); 
 normalizeData(); 
 
 state.latestRound = getLatestRound();
 if (!state.selectedRankingsRound) state.selectedRankingsRound = state.latestRound;
 const roundsWithVotes = ROUND_ORDER.filter(r => state.data.votes_live.some(v => v.round_id === r));
 state.votesRound = roundsWithVotes[roundsWithVotes.length - 1] || state.latestRound;
}

async function boot() {
 try {
   document.getElementById('langSelect').value = currentLang;
   document.getElementById('brandTagline').textContent = t('tagline');
   document.getElementById('menuTagline').textContent = "KÆOS PROJECT • " + (currentLang === 'fr' ? "Choisissez votre destinée" : "Choose your destiny");
   setupNav(); 
   await hydrate(); 
   renderContestants(); 
   renderRankings(); 
   renderVotes();
 } catch (error) {
   console.error("Erreur critique au démarrage :", error);
 }
}

boot();
</script>
